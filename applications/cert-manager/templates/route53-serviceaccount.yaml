{{- if and .Values.config.createIssuer .Values.config.route53.roleArn -}}
# When we use ServiceAccount federation for AWS authentication, we make
# a separate ServiceAccount just for the AWS auth rather than using the
# existing cert-manager ServiceAccount. This is so that we can potentially
# create different issuers with different permissions on different zones in
# AWS. Each of these issuers would use a different Kubernetes ServiceAccount
# that has permissions to assume a different AWS role.
# See https://cert-manager.io/docs/configuration/acme/dns01/route53/#iam-role-with-dedicated-kubernetes-serviceaccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-route53
  labels:
    {{- include "cert-manager.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-route53-tokenrequest
  labels:
    {{- include "cert-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["cert-manager-route53"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-route53-tokenrequest
  labels:
    {{- include "cert-manager.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-manager.serviceAccountName" (index .Subcharts "cert-manager") }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-route53-tokenrequest
{{- end }}
