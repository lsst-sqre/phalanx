argo-cd:
  configs:
    cm:
      url: "https://dac-lsp.lsst.codes/argo-cd"
      oidc.config: |
        name: Keycloak
        issuer: https://keycloak.ls.lsst.org/realms/master
        clientID: argocd-dac
        clientSecret: $dex.clientSecret
        requestedScopes: ["openid", "profile", "email", "groups"]
      ui.bannercontent: "dac-lsp"
    rbac:
      policy.csv: |
        g, k8s-manke-admins, role:admin
        g, sqre, role:admin

        g, rsp-bts, role:readonly

  server:
    ingress:
      hostname: "dac-lsp.lsst.codes"
