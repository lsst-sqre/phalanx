apiVersion: apps/v1
kind: Deployment
metadata:
  name: "csc-versions"
  labels:
    {{- include "csc-versions.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "csc-versions.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "csc-versions.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: {{ .Chart.Name }}
          env:
          {{- if .Values.config.slackAlerts }}
            - name: "CSC_VERSIONS_SLACK_WEBHOOK"
              valueFrom:
                secretKeyRef:
                  name: "csc-versions"
                  key: "slack-webhook"
          {{- end }}
            - name: ENV_EFD
              value: {{ .Values.envEfd }}
            - name: REPO_DIR
              value: "/repo-cache/ts_cycle_build.git"
          {{- if .Values.efdCredentials }}
            - name: EFDAUTH
              value: "{{ .Values.efdCredentials.containerPath }}/{{ .Values.efdCredentials.secretFilename }}"
          {{- end }}
          envFrom:
            - configMapRef:
                name: "csc-versions"
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: "http"
              containerPort: 8080
              protocol: "TCP"
          readinessProbe:
            httpGet:
              path: "/"
              port: "http"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "all"
            readOnlyRootFilesystem: true
          {{- if .Values.efdCredentials }}
          volumeMounts:
          - name: repo-cache
            mountPath: /repo-cache
          - name: efd-credentials
            mountPath: {{ .Values.efdCredentials.containerPath }}/{{ .Values.efdCredentials.secretFilename }}
            subPath: {{ .Values.efdCredentials.secretFilename }}
            readOnly: true
          {{- end }}
      {{- if .Values.efdCredentials }}
      initContainers:
        - name: "efd-credentials-fixer"
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
          - "/bin/sh"
          - "-c"
          - |
            cp /secrets-raw/{{ .Values.efdCredentials.secretFilename }} /secrets/
            chmod 0600 /secrets/{{ .Values.efdCredentials.secretFilename }}
          volumeMounts:
          - name: efd-credentials-raw
            mountPath: /secrets-raw
            readOnly: true
          - name: efd-credentials
            mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "all"
            readOnlyRootFilesystem: true
      volumes:
        - repo-cache:
          emptyDir: {}
        - name: efd-credentials
          emptyDir:
            medium: "Memory"
        - name: efd-credentials-raw
          secret:
            secretName: "csc-versions"
            defaultMode: 0440
            items:
              - key: {{ .Values.efdCredentials.secretFilename | quote }}
                path: {{ .Values.efdCredentials.secretFilename | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
