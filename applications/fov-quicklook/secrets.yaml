s3_repository_access_key:
  description: >-
    The access key for the S3 bucket that contains the tile data.
s3_repository_secret_key:
  description: >-
    The secret key for the S3 bucket that contains the tile data.
db-name:
  description: >-
    Name of the fov-quicklook database in the shared RSP PostgreSQL cluster.
db-url:
  description: >-
    Hostname of the read-write PostgreSQL service for the shared RSP database,
    without a port (for example, rsp-db-rw.postgres-db).
db-user:
  description: >-
    User name for the fov-quicklook database in the shared RSP PostgreSQL cluster.
db-password:
  description: >-
    Password for the fov-quicklook database in the shared RSP PostgreSQL cluster.
"aws-credentials.ini":
  description: >-
    Google Cloud Storage credentials to the Butler data store, formatted using
    AWS syntax for use with boto.
  copy:
    application: nublado
    key: aws-credentials.ini
"postgres-credentials.txt":
  description: >-
    PostgreSQL credentials in its pgpass format for the Butler database.
  copy:
    application: nublado
    key: postgres-credentials.txt
