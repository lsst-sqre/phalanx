config:
  s3_tile_path_prefix: "fov-quicklook/prod/"
  max_object_storage_usage: 450_000_000_000
admin_page: true
db_storage_class: wekafs--sdf-k8s01
log_level: warning
context_menu_templates:
  - name: "UUID"
    template: "%(uuid)"
    is_url: false
  - name: "Data ID for Butler"
    template: "{'exposure': %(exposure), 'detector': %(detector)}"
    is_url: false
  - name: "Butler Snippet"
    template: |
      from lsst.daf.butler import Butler
      butler = Butler('embargo')
      ref = butler.get_dataset("%(uuid)")
      if ref is None:
          raise LookupError("Dataset was not found")
      data = butler.get(ref)
    is_url: false
  - name: "LSSTCam/Calexp mosaic"
    template: "https://usdf-rsp.slac.stanford.edu/rubintv/summit-usdf/lsstcam/event?channel_name=calexp_mosaic&date_str=%(day_obs|iso8601)&seq_num=%(exposure|sequence)"
    is_url: true
