{{- if .Values.use_vault }}
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: fov-quicklook
spec:
  path: "{{ .Values.global.vaultSecretsPath }}/fov-quicklook"
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: fov-quicklook-db
spec:
  path: "{{ .Values.global.vaultSecretsPath }}/quicklook"
  type: Opaque
{{- end }}
