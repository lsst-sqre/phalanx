"google_creds.json":
  description: >-
    Google service account credentials used to write async job output to
    Google Cloud Storage.
  copy:
    application: ssotap
    key: "google_creds.json"
pgpassword:
  description: >-
    Password to external PostgreSQL server that contains the ConsDB data.
  copy:
    application: exposurelog
    key: exposurelog_password
tap-schema-password:
  description: >-
    Password for tap_schema database (CloudSQL or external PostgreSQL).
  if: cadc-tap.tapSchema.useVaultPassword
uws-db-password:
  description: >-
    Password for uws database (CloudSQL or external PostgreSQL).
  if: cadc-tap.uws.useVaultPassword
