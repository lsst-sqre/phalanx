AWS_ACCESS_KEY_ID:
  description: >-
    Access key ID for the S3 bucket used to store async job results.
  copy:
    application: tap
    key: AWS_ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY:
  description: >-
    Secret access key for the S3 bucket used to store async job results.
  copy:
    application: tap
    key: AWS_SECRET_ACCESS_KEY
tap-schema-admin-password:
  description: >-
    Admin password for the tap_schema_admin_consdbtap database account, used
    by Repertoire to manage the TAP_SCHEMA schema.
