base_efd-password:
  description: >-
    InfluxDB password for the sasquatch user for accessing the EFD database on
    the base teststand. Clients will cache this secret locally in their client
    configuration, so changing it may be disruptive.
base_metrics-password:
  description: >-
    InfluxDB password for the metrics-reader user for accessing the
    lsst.square.metrics database on the base teststand. Must match the
    Sasquatch influxdb-metrics-reader-password secret.
