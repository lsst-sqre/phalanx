config:
  influxdbDatabases:
    roundtable_dev_metrics:
      url: "https://roundtable-dev.lsst.cloud/influxdb/"
      database: "lsst.square.metrics"
      description: >-
        Metrics generated by Phalanx applications in the roundtable-dev
        environment.
      username: "metrics-reader"
      passwordKey: "roundtable_dev_metrics-password"
      schemaRegistry: "http://sasquatch-schema-registry.sasquatch:8081/"
      local: true
  slackAlerts: true
