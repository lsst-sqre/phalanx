summit_efd-password:
  description: >-
    InfluxDB password for the sasquatch user for accessing the EFD database at
    the summit. Clients will cache this secret locally in their client
    configuration, so changing it may be disruptive.
summit_metrics-password:
  description: >-
    InfluxDB password for the metrics-reader user for accessing the
    lsst.square.metrics database at the summit. Must match the Sasquatch
    influxdb-metrics-reader-password secret.
usdf_efd-password:
  description: >-
    InfluxDB password for the sasquatch user for accessing the production EFD
    database at USDF. Clients will cache this secret locally in their client
    configuration, so changing it may be disruptive.
