config:
  influxdbDatabases:
    base_efd:
      url: "https://base-lsp.lsst.codes/influxdb/"
      database: "efd"
      username: "sasquatch"
      passwordKey: "base_efd-password"
      schemaRegistry: "http://sasquatch-schema-registry.sasquatch:8081"
      local: true
    base_metrics:
      url: "https://base-lsp.lsst.codes/influxdb/"
      database: "lsst.square.metrics"
      description: >-
        Metrics generated by Phalanx applications in the base environment.
      username: "metrics-reader"
      passwordKey: "base_metrics-password"
      schemaRegistry: "http://sasquatch-schema-registry.sasquatch:8081/"
      local: true
  slackAlerts: true
