config:
  availableDatasets:
    - "dp02"
    - "dp03"
    - "dp1"
    - "dp2"
    - "prompt"
  hips:
    legacy:
      dataset: "dp1"
  influxdbDatabases:
    idfint_metrics:
      url: "https://data-int.lsst.cloud/influxdb/"
      database: "lsst.square.metrics"
      description: >-
        Metrics generated by Phalanx applications in the idfint environment.
      username: "metrics-reader"
      passwordKey: "idfint_metrics-password"
      schemaRegistry: "http://sasquatch-schema-registry.sasquatch:8081/"
      local: true
  metrics:
    enabled: true
  obscoreConfigs:
    dp2: "https://raw.githubusercontent.com/lsst-dm/dax_obscore/refs/heads/main/configs/dp2.yaml"
  rules:
    gafaelfawr:
      ui:
        comanage:
          title: "Account settings"
          template: "https://id-int.lsst.cloud/"
    times-square:
      internal:
        times-square:
          requiredScopes:
            - "exec:admin"
  slackAlerts: true
  tap:
    servers:
      ppdbtap:
        enabled: true
        schemaVersion: "tickets/DM-52639"
        schemas:
          - "ppdb"
          - "dp2_prompt"
      ssotap:
        enabled: true
      tap:
        enabled: true
  useSubdomains:
    - "nublado"

cloudsql:
  enabled: true
  instanceConnectionName: "science-platform-int-dc5d:us-central1:science-platform-int-8f439af2"
  serviceAccount: "repertoire@science-platform-int-dc5d.iam.gserviceaccount.com"
