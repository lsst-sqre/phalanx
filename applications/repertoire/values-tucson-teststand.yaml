config:
  influxdbDatabases:
    tucson_teststand_efd:
      url: "https://tucson-teststand.lsst.codes/influxdb/"
      database: "efd"
      username: "sasquatch"
      passwordKey: "tucson_teststand_efd-password"
      schemaRegistry: "http://sasquatch-schema-registry.sasquatch:8081"
      local: true
    tucson_teststand_metrics:
      url: "https://tucson-teststand.lsst.codes/influxdb/"
      database: "lsst.square.metrics"
      description: >-
        Metrics generated by Phalanx applications in the tucson-teststand
        environment.
      username: "metrics-reader"
      passwordKey: "tucson_teststand_metrics-password"
      schemaRegistry: "http://sasquatch-schema-registry.sasquatch:8081/"
      local: true
  slackAlerts: true
