config:
  availableDatasets:
    - "dp02"
    - "dp03"
    - "dp1"
    - "efd"
  hips:
    datasets: {}
  tap:
    schemaVersion: "w.2026.36"
    schemaSourceTemplate: "https://github.com/lsst/sdm_schemas/archive/refs/tags/{version}.tar.gz"
    servers:
      tap:
        enabled: true
        schemas:
          - "dp1"
          - "ivoa_obscore"
          - "dp02_dc2"
        databaseUrl: "postgresql://tap_schema_admin_tap@rsp-db-rw.postgres-db:5432/tap"
        databasePasswordKey: "tap-schema-admin-password"
      ssotap:
        enabled: true
        databaseUrl: "postgresql://tap_schema_admin_ssotap@rsp-db-rw.postgres-db:5432/ssotap"
        databasePasswordKey: "ssotap-schema-admin-password"
      consdbtap:
        enabled: true
        schemaVersion: "w.2026.46"
        databaseUrl: "postgresql://tap_schema_admin_consdbtap@rsp-db-rw.postgres-db:5432/consdbtap"
        databasePasswordKey: "consdbtap-schema-admin-password"
  influxdbDatabases:
    usdf_efd:
      url: "https://usdf-rsp.slac.stanford.edu/influxdb-enterprise-data/"
      database: "efd"
      description: >-
        Engineering and Facility Database at the USDF production environment (replicated from the Summit).
      username: "sasquatch"
      passwordKey: "usdf_efd-password"
      schemaRegistry: "http://sasquatch-schema-registry-remote.sasquatch:8081"
      local: true
    usdf_prompt:
      url: "https://usdf-rsp.slac.stanford.edu/influxdb-enterprise-data/"
      database: "lsst.prompt"
      description: >-
        Prompt Processing pipeline metrics at the USDF production environment.
