config:
  availableDatasets:
    - "dp02"
    - "dp03"
    - "dp1"
    - "dp2"
    - "prompt"
  hips:
    legacy:
      dataset: "dp1"
  metrics:
    enabled: true
  rules:
    # Override the required scope of times-square. Unfortunately, there is no
    # way to do this at the moment without duplicating the entry.
    times-square:
      - type: "internal"
        name: "times-square"
        requiredScopes:
          - "exec:admin"
        template: "https://{{base_hostname}}/times-square/api"
        openapi: "https://{{base_hostname}}/times-square/api/openapi.json"
        docsUrl: "https://times-square.lsst.io/"
        versions:
          v1:
            template: "https://{{base_hostname}}/times-square/api/v1"
  slackAlerts: true
  tap:
    servers:
      tap:
        enabled: true
      ssotap:
        enabled: true
  useSubdomains:
    - "nublado"

cloudsql:
  enabled: true
  instanceConnectionName: "science-platform-stable-6994:us-central1:science-platform-stable-0c29612b"
  serviceAccount: "repertoire@science-platform-stable-6994.iam.gserviceaccount.com"
