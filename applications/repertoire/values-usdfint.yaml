config:
  availableDatasets:
    - "dp02"
    - "dp03"
    - "dp1"
    - "efd"
  hips:
    datasets: {}
  influxdbDatabases:
    usdfint_metrics:
      url: "https://usdf-rsp-int.slac.stanford.edu/influxdb/"
      database: "lsst.square.metrics"
      description: >-
        Metrics generated by Phalanx applications in the usdfint environment.
      username: "metrics-reader"
      passwordKey: "usdfint_metrics-password"
      schemaRegistry: "http://sasquatch-schema-registry.sasquatch:8081/"
      local: true
  tap:
    schemaVersion: "w.2026.36"
    schemaSourceTemplate: "https://github.com/lsst/sdm_schemas/archive/{version}.tar.gz"
    servers:
      consdbtap:
        enabled: true
        schemaVersion: "w.2026.36"
        databaseUrl: "postgresql://tap_schema_admin_consdbtap@rsp-db-rw.postgres-db:5432/consdbtap"
        databasePasswordKey: "consdbtap-schema-admin-password"
      ssotap:
        enabled: true
        databaseUrl: "postgresql://tap_schema_admin_ssotap@rsp-db-rw.postgres-db:5432/ssotap"
        databasePasswordKey: "ssotap-schema-admin-password"
      tap:
        enabled: true
        schemas:
          - "dp1"
          - "ivoa_obscore"
          - "dp02_dc2"
        databaseUrl: "postgresql://tap_schema_admin_tap@rsp-db-rw.postgres-db:5432/tap"
        databasePasswordKey: "tap-schema-admin-password"
