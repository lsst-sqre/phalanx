apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octavius-db-nw-policy
spec:
  podSelector:
    matchLabels:
      {{- $labels := include "octavius.selectorLabels" . | fromYaml }}
      {{- $_ := set $labels "component" "database" }}
      {{- toYaml $labels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The API
        - podSelector:
            matchLabels:
              {{- $labels := include "octavius.selectorLabels" . | fromYaml }}
              {{- $_ := set $labels "component" "api" }}
              {{- toYaml $labels | nindent 14 }}
        # Other replica set members
        - podSelector:
            matchLabels:
              {{- $labels := include "octavius.selectorLabels" . | fromYaml }}
              {{- $_ := set $labels "component" "database" }}
              {{- toYaml $labels | nindent 14 }}
        # The mongo-setup job (replica set init and seed merge)
        - podSelector:
            matchLabels:
              component: "mongo-setup"
      ports:
        - protocol: "TCP"
          port: 27017
