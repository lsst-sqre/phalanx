apiVersion: apps/v1
kind: Deployment
metadata:
  name: "octavius-ui-deploy"
  labels:
    {{- include "octavius.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount_ui }}
  selector:
    matchLabels:
      {{- include "octavius.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "octavius.selectorLabels" . | nindent 8 }}
        component: "frontend"
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        # nginx serving the static build; the API proxy target and public
        # account are baked into the image, so no runtime env is needed
        - name: {{ .Chart.Name }}-ui
          image: "{{ .Values.imageUI.repository }}:{{ .Values.imageUI.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imageUI.pullPolicy }}
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - name: "http"
              containerPort: 80
              protocol: "TCP"
          readinessProbe:
            httpGet:
              path: "/octavius/"
              port: "http"
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "all"
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000