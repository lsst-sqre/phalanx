slack-webhook:
  description: >-
    Slack web hook used to report internal errors to Slack. This secret may be
    changed at any time.
  if: config.slackAlerts
  copy:
    application: mobu
    key: app-alert-webhook
mongo-root-password:
  description: >-
    Password for the MongoDB root user. Set when the database is first
    initialised; changing it later requires updating the user in MongoDB too.
  generate:
    type: password
mongo-keyfile:
  description: >-
    Shared key used by the MongoDB replica set members to authenticate to each
    other. All members must restart together if this is changed.
  generate:
    type: password
azure-db-url:
  description: >-
    URL (including SAS token) of the zipped seed database dump in Azure Blob
    Storage. The mongo-setup job merges anything missing from it into the
    live database on each sync.
az-storage-ac-name:
  description: >-
    Azure Storage account name used by the API to generate SAS tokens for
    survey images.
az-storage-ac-key:
  description: >-
    Azure Storage account key used by the API to generate SAS tokens for
    survey images. May be rotated at any time; restart the API afterwards.
