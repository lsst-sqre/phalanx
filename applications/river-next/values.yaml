# Default values for river.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  # -- Image to run, built by the `mppdb` repository
  repository: "ghcr.io/mjuric/mppdb"

  # -- Tag of the image to run. **PLACEHOLDER**: no image has been published
  # yet, so this must be replaced with a real tag (and pinned per environment)
  # before the chart is deployed.
  tag: "sha-PLACEHOLDER"

  # -- Pull policy for the image. Use `Always` where the tag is mutable, such as
  # a branch name.
  pullPolicy: "IfNotPresent"

  # -- Names of image pull secrets in the app's namespace, for a private
  # registry. `ghcr.io/mjuric/mppdb` is private (the image bakes the source of a
  # private repository), so pulling it requires one; at usdfdev this is the
  # hand-created `river-pull` docker-registry secret (a `read:packages` GitHub
  # PAT), managed the same way as the `river` secret until Vault access exists.
  pullSecrets: []

# -- Command to run in the container. `mppdb up` starts and supervises the
# service stack, which is what the container image's start script does.
command:
  - "mppdb"
  - "up"

config:
  # -- Query engine, supplied as `MPPDB_ENGINE`. `clickhouse` runs ADQL against
  # a ClickHouse server over HTTP rather than against a local DuckDB.
  engine: "clickhouse"

  clickhouse:
    # -- Host name of the ClickHouse server, supplied as
    # `MPPDB_CLICKHOUSE_HOST`. This is **outside** the Kubernetes cluster, so
    # egress from the pod to it must be permitted.
    host: "sdfiana035.sdf.slac.stanford.edu"

    # -- HTTP port of the ClickHouse server, supplied as
    # `MPPDB_CLICKHOUSE_PORT`
    port: 8123

  # -- Identity provider, supplied as `MPPDB_AUTH_PROVIDER`. `apikey` validates
  # the service's own API keys and is what the initial smoke deployment uses;
  # this flips to `gafaelfawr` once the service can consume the identity
  # headers injected by the ingress.
  authProvider: "apikey"

  # -- Public base URL the service advertises in generated URLs, supplied as
  # `MPPDB_BASE_URL`.
  # @default -- `global.baseUrl` plus `ingress.pathPrefix`
  baseUrl: ""


  # -- URL of the identity provider's token-creation page, supplied as
  # `MPPDB_TOKEN_PAGE_URL`. Shown by the console's token guidance in
  # `gafaelfawr` auth mode; empty hides the link and tells the user to ask the
  # operator.
  tokenPageUrl: ""

  # -- Whether the service advertises the URL a client actually reached it on
  # (True) or pins the configured `baseUrl` for every generated URL (False).
  # Behind a TLS-terminating proxy the pod sees plain http, so leaving this True
  # mints `http://` job/redirect URLs the https console then blocks; set it False
  # so async job and result URLs are pinned to the external https `baseUrl`.
  # TOML-only (no env var), so it is rendered into the mppdb.toml ConfigMap.
  advertiseRequestBase: true

  # -- Container path of the persistent data directory, supplied as
  # `MPPDB_DATA_DIR`. The state database, spool, lake, and manifests all live
  # beneath it, and it is where the PVC is mounted.
  dataDir: "/data"

  # -- Container path the spool claim is mounted at, supplied as
  # `MPPDB_SPOOL_DIR`. Separate volume; see `persistence.spoolSize`.
  spoolDir: "/spool"

  # -- Path the console's PyVO and TOPCAT recipes (and the .ipynb export) tell
  # users to keep their token in, written to `MPPDB_TOKEN_FILE`. A top-level
  # service setting, NOT branding: it is a path, not a display string. Must
  # differ from other front-ends' — the accounts deployment keeps
  # `~/.mppdb.token`, so a user of both does not have them collide in one file.
  tokenFile: "~/.river.token"

  # -- Byte ceiling above which new async jobs are refused with 503 +
  # Retry-After, written to `MPPDB_SPOOL_WATERMARK_BYTES`. The image default is
  # 1 TiB, which on a 2 TiB spool would strand half the volume; but the
  # watermark must also stay far enough below capacity that the results already
  # in flight when it trips can still finish, or it fires only once the disk is
  # already full — which is the ENOSPC this whole arrangement exists to prevent.
  # Headroom is therefore sized from the worst case: `max_result_bytes` is 16 GiB
  # and the heavy tier allows 16 concurrent jobs, so 256 GiB can legitimately be
  # mid-write. 2 TiB - 256 GiB = 1.75 TiB, or 87.5% of the volume usable.
  # Quoted: unquoted, YAML reads 13 digits as a float and Helm renders it as
  # 1.924145348608e+12, which the service's integer parser rejects.
  spoolWatermarkBytes: "1924145348608"

  # -- Directory holding the snapshot manifests, supplied as
  # `MPPDB_MANIFESTS_DIR`. Must be set explicitly: leaving it unset silently
  # yields an empty snapshot.
  manifestsDir: "/data/manifests"

  # -- Directory used for temporary spill files, supplied as `TMPDIR`. Kept on
  # the persistent volume rather than in `/tmp`, which is a small in-memory
  # emptyDir.
  tmpDir: "/data/tmp"

  # -- Directory **inside the image** holding the registry YAML files that the
  # `[databases]` entries below refer to. **PLACEHOLDER**: confirm this against
  # the published image at integration time; nothing in this chart can verify
  # it.
  registryDir: "/opt/mppdb/deploy/usdf"

  # -- Database that unqualified ADQL table names resolve to, written to
  # `default_database` in the TOML configuration. **Empty on purpose**: with no
  # default, every table reference must be qualified as `database.table`, which
  # is what we want now that the obsolete `mppdb` database is gone and no single
  # database is the natural home for a bare name. Setting this omits the TOML
  # key entirely; it must name one of the `databases` entries if set at all.
  defaultDatabase: ""

  # -- Database that Simple Cone Search resolves its table against. Independent
  # of `defaultDatabase` -- SCS targets exactly one database, and with no
  # default it would otherwise refuse every request. Must be a `databases` entry.
  scsDatabase: "dp2"

  # -- Bare table name SCS uses when the request omits one. Must exist in
  # `scsDatabase`; note `dp2` has `DiaObject` and no `DiaObjectLast`.
  scsDefaultTable: "DiaObject"

  # -- Databases to serve, rendered into the `[databases]` tables of the
  # generated `mppdb.toml`. This block is the authorization boundary: a database
  # absent here is not served, whatever the catalog store holds. `chDatabase` is
  # the physical ClickHouse database. `manifestsDir` and `lakeDir` are set only
  # for databases that have a Parquet lake and snapshot pointer; static
  # ClickHouse-only imports leave them out. A `registry` key is also accepted,
  # resolved against `config.registryDir`, but it is **ignored under
  # `MPPDB_ENGINE=clickhouse`**, which this deployment uses: the catalog comes
  # from `TAP_SCHEMA.registries` in the store. Do not set it here.
  # @default -- `dp2`, `ppdb`, and `ssp`; see `values.yaml`
  databases:
    dp2:
      chDatabase: "dp2"
    ppdb:
      chDatabase: "ppdb"
    ssp:
      chDatabase: "ssp"

  # -- Display branding, rendered into the `[branding]` table of the generated
  # `mppdb.toml` as string keys. Empty omits the table, leaving the image's
  # built-in branding.
  branding: {}

  # -- Container path the generated `mppdb.toml` is mounted at, supplied as
  # `MPPDB_CONFIG`
  configPath: "/etc/mppdb/mppdb.toml"

  # -- Port the Prometheus metrics server listens on, supplied as
  # `MPPDB_METRICS_PORT`
  metricsPort: 9100

  # -- Address the metrics server binds to, supplied as `MPPDB_METRICS_ADDR`.
  # The service defaults this to loopback, which would make the metrics port
  # unreachable from outside the pod.
  metricsAddr: "0.0.0.0"

  # -- Port the service listens on, supplied as `MPPDB_PORT`
  port: 8080

  # -- Address the service binds to, supplied as `MPPDB_HOST`. The service
  # defaults this to loopback, which would make the pod unreachable.
  host: "0.0.0.0"

  # -- Additional environment variables for the container, as a mapping of name
  # to value. Use this for `MPPDB_*` settings that have no dedicated value
  # above. Never put credentials here; they come from the `river` secret.
  extraEnv: {}

  # -- Whether to create a `VaultSecret` for the `river` secret. When false,
  # the secret is expected to have been created by hand, which is how the
  # initial smoke deployment works.
  useVaultSecret: false

persistence:
  # -- Size of the claim for `config.dataDir`
  size: "20Gi"

  # -- Size of the separate spool claim, which holds async query results. Sized
  # far above the data claim because a single result can be tens of GiB and
  # results are retained for 7 days; the per-user `spool_quota_bytes` only means
  # anything if the volume is larger than the quota.
  spoolSize: "2Ti"

  # -- Storage class backing the claim. `wekafs--sdf-k8s01` is the
  # Weka-backed dynamic provisioner used by every other USDF application that
  # needs a read-write-once volume. Omit to use the cluster default.
  storageClassName: "wekafs--sdf-k8s01"

ingress:
  # -- Additional annotations for the ingress rule
  annotations: {}

  # -- Authentication challenge Gafaelfawr issues on a 401. `basic` matches the
  # other TAP services, and lets VO clients that only speak HTTP basic send a
  # token as the password.
  authType: "basic"

  # -- Gafaelfawr scope required to reach the service. `read:tap` is the scope
  # every other TAP service in Phalanx requires.
  scope: "read:tap"

  # -- URL path the service is served under. The service itself serves at the
  # root, so the ingress rewrites this prefix away.
  pathPrefix: "/river"

  # -- Whether Gafaelfawr should replace the client's `Authorization` header
  # with the delegated internal token. Must stay false while
  # `config.authProvider` is `apikey`, because the service validates that
  # header itself.
  useAuthorization: false

  # -- Timeout for proxied requests, in seconds. Synchronous ADQL queries can
  # run for a long time, and the nginx default of 60s would cut them off.
  timeout: 1800

# -- Resource requests and limits. **Guess**: this is a query front end, not the
# database, so it is sized for request handling and result spooling rather than
# for scans. Revisit once real query load has been measured.
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# -- Security context for the pod. `fsGroup` is what makes the persistent
# volume writable by the unprivileged service user, so it must match the uid
# and gid the image runs as.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Annotations for the pod
podAnnotations: {}

# -- Node selector rules for the pod
nodeSelector: {}

# -- Tolerations for the pod
tolerations: []

# -- Affinity rules for the pod
affinity: {}

# The following will be set by parameters injected by Argo CD and should not
# be set in the individual environment values files.
global:
  # -- Base URL for the environment
  # @default -- Set by Argo CD
  baseUrl: null

  # -- Host name for ingress
  # @default -- Set by Argo CD
  host: null

  # -- Base path for Vault secrets
  # @default -- Set by Argo CD
  vaultSecretsPath: null

# ClickHouse server run by this application: a single-replica StatefulSet that
# the front end queries in-cluster, and that ingest and direct clients on SDF
# hosts reach through a MetalLB LoadBalancer.
clickhouse:
  image:
    # -- ClickHouse server image
    repository: "clickhouse/clickhouse-server"

    # -- Tag of the ClickHouse image. 26.8 is an LTS line. Once this server has
    # written data, moving to an older release is not possible.
    tag: "26.8.16.41"

    # -- Digest the tag is pinned to, so the image cannot change under the tag
    digest: "sha256:bca86231e6f8e8969f442135843e44105d54fa61babd84b71f6f7c146f207a8e"

    # -- Pull policy for the ClickHouse image
    pullPolicy: "IfNotPresent"

  # -- Resource requests and limits for the ClickHouse pod. Requests must equal
  # limits (rendering fails otherwise). `max_server_memory_usage` and the
  # default `max_threads` are derived from the limits.
  resources:
    requests:
      cpu: "64"
      memory: "384Gi"
    limits:
      cpu: "64"
      memory: "384Gi"

  # -- Fraction of the memory limit ClickHouse may use, rendered in bytes as
  # `max_server_memory_usage`
  maxServerMemoryUsageRatio: 0.9

  # -- (int) `max_threads` for the default settings profile. Must be set explicitly
  # rather than left to ClickHouse, because the container sees every host core
  # while its cgroup allows far fewer. If set, a positive integer; unset or 0
  # uses the default.
  # @default -- The integer part of `clickhouse.resources.limits.cpu`
  maxThreads: null

  # -- `background_pool_size` (threads for merges and mutations)
  backgroundPoolSize: 16

  # -- `uncompressed_cache_size`, in bytes (8 GiB)
  uncompressedCacheSize: 8589934592

  # -- `mark_cache_size`, in bytes (5 GiB)
  markCacheSize: 5368709120

  # -- Storage class of the claim holding the data and staging directories.
  # Its volumes are a hostPath on the whole `/sdf/data/rubin` filesystem with a
  # `Delete` reclaim policy: patch the bound PV to `Retain` before anything may
  # delete the claim.
  storageClassName: "sdf-data-rubin"

  # -- Path within the storage class's filesystem mounted at
  # `/var/lib/clickhouse` (the server's data directory)
  dataSubPath: "repo/dp2_prep/u/mjuric/river-next/clickhouse"

  # -- Path within the storage class's filesystem mounted at
  # `/var/lib/clickhouse-user-files` (`user_files_path`, where ingest stages
  # files for `file()`)
  userFilesSubPath: "repo/dp2_prep/u/mjuric/river-next/user-files"

  # -- Pod security context. The pod runs as the uid and gid that own the data
  # directory on the host filesystem. Never add `fsGroup`: the volume is a
  # hostPath holding existing data, which must not be chowned (rendering fails
  # on `fsGroup` or `fsGroupChangePolicy`). `runAsUser` and `runAsNonRoot:
  # true` are required.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 18728
    runAsGroup: 1126

  # -- Node selector rules for the ClickHouse pod
  nodeSelector:
    edu.stanford.slac.sdf.project/rsp: "true"

  # -- Tolerations for the ClickHouse pod
  tolerations:
    - key: "edu.stanford.slac.sdf.project/rsp"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  # -- Affinity rules for the ClickHouse pod. The default prefers nodes not
  # running ephemcache's large batch pods.
  # @default -- Preferred anti-affinity against ephemcache pods
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: "kubernetes.io/hostname"
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: "ephemcache"
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: "ephemcache"

  # -- Annotations for the ClickHouse pod
  podAnnotations: {}

  # -- Seconds the server is given to shut down cleanly before it is killed
  terminationGracePeriodSeconds: 300

  pdb:
    # -- Whether to create a PodDisruptionBudget (`minAvailable: 1`) for the
    # ClickHouse pod, which blocks voluntary evictions such as node drains
    enabled: true

  # -- IP address to pin the LoadBalancer service to, from the
  # `sdf-rubin-ingest` MetalLB pool. Leave empty for the first deployment, then
  # set it to the address MetalLB assigned so it survives the service being
  # recreated.
  loadBalancerIP: ""

  livenessProbe:
    # -- Whether the ClickHouse container has a liveness probe at all
    enabled: true

    # -- What the liveness probe checks: `ping` (HTTP `GET /ping`) or `data`
    # (reads the `status` file ClickHouse writes in its data directory at
    # startup, and pings), so a lost data mount fails the probe
    check: "data"

    # -- Seconds between liveness probes
    periodSeconds: 30

    # -- Consecutive liveness failures before the container is restarted
    failureThreshold: 5

    # -- Seconds before a liveness probe counts as failed
    timeoutSeconds: 10

  startupProbe:
    # -- Seconds between startup probes
    periodSeconds: 10

    # -- Startup probe failures allowed before the container is restarted.
    # With the default period this allows 30 minutes for metadata loading.
    failureThreshold: 180
