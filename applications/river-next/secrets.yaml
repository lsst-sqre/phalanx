MPPDB_CLICKHOUSE_USER:
  description: >-
    Username for the external ClickHouse server that answers ADQL queries. The
    account is read-only. The key is named after the environment variable
    because the pod consumes this secret with envFrom.
  if: config.useVaultSecret
MPPDB_CLICKHOUSE_PASSWORD:
  description: >-
    Password for the external ClickHouse server that answers ADQL queries.
  if: config.useVaultSecret
ADMIN_SHA256:
  description: >-
    SHA-256 (64 lowercase hex digits) of the password of the ClickHouse `admin`
    user, which has full access including user management. Injected into the
    ClickHouse server's user configuration with `from_env`.
  if: config.useVaultSecret
MPPDB_RO_SHA256:
  description: >-
    SHA-256 (64 lowercase hex digits) of the password of the read-only
    ClickHouse `mppdb_ro` user that the front end queries as. Must match the
    password in `MPPDB_CLICKHOUSE_PASSWORD`.
  if: config.useVaultSecret
SSP_XMATCH_SHA256:
  description: >-
    SHA-256 (64 lowercase hex digits) of the password of the ClickHouse
    `ssp_xmatch` user, used for cross-matching against SSP tables.
  if: config.useVaultSecret
