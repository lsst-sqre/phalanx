{{- if .Values.config.useVaultSecret -}}
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  # The secret the ClickHouse StatefulSet reads the password hashes from. When
  # config.useVaultSecret is false, a secret of this name is created by hand.
  name: "river-next-clickhouse"
  labels:
    {{- include "river-next.clickhouse.labels" . | nindent 4 }}
spec:
  # The app's Vault path also holds the front end's credentials; copy only
  # the three hashes into this secret.
  keys:
    - "ADMIN_SHA256"
    - "MPPDB_RO_SHA256"
    - "SSP_XMATCH_SHA256"
  path: "{{ .Values.global.vaultSecretsPath }}/river-next"
  type: Opaque
{{- end }}
