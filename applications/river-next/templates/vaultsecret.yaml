{{- if .Values.config.useVaultSecret -}}
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  # Same name the Deployment's envFrom consumes, so turning this flag on
  # replaces the hand-created secret in place with no other change.
  name: "river-next"
  labels:
    {{- include "river-next.labels" . | nindent 4 }}
spec:
  path: "{{ .Values.global.vaultSecretsPath }}/river-next"
  # Only the front-end's own keys. The same Vault path also holds the
  # ClickHouse password hashes, which must not reach this pod's environment.
  keys:
    - "MPPDB_CLICKHOUSE_USER"
    - "MPPDB_CLICKHOUSE_PASSWORD"
  type: Opaque
{{- end }}
