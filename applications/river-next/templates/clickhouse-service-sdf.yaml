apiVersion: v1
kind: Service
metadata:
  name: "river-next-clickhouse-sdf"
  labels:
    {{- include "river-next.clickhouse.labels" . | nindent 4 }}
  annotations:
    # An address on the SDF network, for ingest and direct clients on SDF
    # hosts. HTTP only; the native protocol is not exposed outside the cluster.
    metallb.io/address-pool: "sdf-rubin-ingest"
    {{- with .Values.clickhouse.loadBalancerIP }}
    metallb.io/loadBalancerIPs: {{ . | quote }}
    {{- end }}
spec:
  type: "LoadBalancer"
  allocateLoadBalancerNodePorts: false
  ports:
    - port: 8123
      targetPort: "http"
      protocol: "TCP"
      name: "http"
  selector:
    {{- include "river-next.clickhouse.selectorLabels" . | nindent 4 }}
