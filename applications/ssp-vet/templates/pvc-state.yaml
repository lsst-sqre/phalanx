apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "ssp-vet-state"
  labels:
    {{- include "ssp-vet.labels" . | nindent 4 }}
  annotations:
    # This volume holds the only copy of the reviewers' scores. Deleting the
    # claim destroys them, so neither Argo CD's pruning nor a Helm uninstall is
    # allowed to take it.
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
