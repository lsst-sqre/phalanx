apiVersion: gafaelfawr.lsst.io/v1alpha1
kind: GafaelfawrIngress
metadata:
  name: "ssp-vet"
  labels:
    {{- include "ssp-vet.labels" . | nindent 4 }}
config:
  # A browser app: send people without a session to Rubin SSO.
  loginRedirect: true
  scopes:
    all:
      - {{ .Values.ingress.scope | quote }}
  service: "ssp-vet"
template:
  metadata:
    name: "ssp-vet"
    {{- with .Values.ingress.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  spec:
    rules:
      - host: {{ required "global.host must be set" .Values.global.host | quote }}
        http:
          paths:
            # The prefix is passed through unchanged; the app strips it itself
            # (SSP_VET_PATH_PREFIX) and redirects the bare prefix to the
            # trailing-slash form its relative URLs need.
            - path: {{ .Values.ingress.pathPrefix | quote }}
              pathType: "Prefix"
              backend:
                service:
                  name: "ssp-vet"
                  port:
                    number: 8080
