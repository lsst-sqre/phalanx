environment:

config:
  database_schema: "obsloctap"
  separateSecrets: false
  database_url: "usdf-butler.slac.stanford.edu:5432"
  database_name: "lsstdb1"
  database_username: "rubin"
  consdb_url: "usdf-summitdb-logical-replica-svc.sdf.slac.stanford.edu:5432"
  consdb_database: "exposurelog"
  consdb_username: "usdf"

image:
  pullPolicy: Always

consumekafka:
  image:
    # -- Tag of image to use
    tag: "1.1.4"
  logLevel: info
  pvcMountpoint:
    - name: sdf-data-rubin
      storageClassName: sdf-data-rubin
      capacity: 1Gi
      accessMode: ReadOnlyMany
      mountPath: /sdf/data/rubin

obsloctap:
  image:
    # -- Tag of image to use
    # @default -- The appVersion of the chart
    tag: "1.1.4"
  logLevel: info

controller:
  config:
    safir:
      logLevel: "None"

kafka:
  sasquatchAddress: 10.100.226.209:9094
