apiVersion: apps/v1
kind: Deployment
metadata:
  name: "svab-slack-bot"
  labels:
    {{- include "svab-slack-bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "svab-slack-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "svab-slack-bot.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: "SVAB_BOT_WEBHOOK_SECRET"
              valueFrom:
                secretKeyRef:
                  name: "svab-slack-bot"
                  key: "svab_bot_webhook_secret"
            - name: "SVAB_BOT_SLACK_BOT_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: "svab-slack-bot"
                  key: "svab_bot_slack_bot_token"
            - name: "SVAB_BOT_JIRA_API_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: "svab-slack-bot"
                  key: "svab_bot_jira_api_token"
            {{- range $env_var, $env_value := .Values.env }}
            - name: {{ $env_var }}
              value: {{ $env_value | quote }}
            {{- end }}
          ports:
            - name: "http"
              containerPort: 8080
              protocol: "TCP"
          readinessProbe:
            httpGet:
              path: "/"
              port: "http"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "all"
            readOnlyRootFilesystem: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
