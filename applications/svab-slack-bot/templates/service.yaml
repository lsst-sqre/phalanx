apiVersion: v1
kind: Service
metadata:
  name: "svab-slack-bot"
  labels:
    {{- include "svab-slack-bot.labels" . | nindent 4 }}
spec:
  type: "ClusterIP"
  ports:
    - port: 8080
      targetPort: "http"
      protocol: "TCP"
      name: "http"
  selector:
    {{- include "svab-slack-bot.selectorLabels" . | nindent 4 }}
