image:
  repository: "ghcr.io/tribeiro/svab-slack-bot"
  pullPolicy: "Always"
  tag: "jira-basic-credentials"
resources:
  requests:
    cpu: 50m
    memory: 50Mi
  limits:
    cpu: 500m
    memory: 60Mi
env:
  SVAB_BOT_SLACK_APPROVERS_GROUP_ID: S0CCL2ABGV9
  SVAB_BOT_JIRA_SITE_URL: "https://rubinobs.atlassian.net"
  SVAB_BOT_SLACK_CHANNEL_ID: C0C81KEFTG8
  SVAB_BOT_SLACK_MAIN_GROUP_ID: S0CCL2ABGV9
  SVAB_BOT_ANNOUNCE_SINCE: "2026-11-05T00:00:00Z"
  SVAB_BOT_PATH_PREFIX: /svab-slack-bot
  SVAB_BOT_RECONCILE_INTERVAL_MINUTES: 1
  SVAB_BOT_RECONCILE_LOOKBACK_HOURS: 24
