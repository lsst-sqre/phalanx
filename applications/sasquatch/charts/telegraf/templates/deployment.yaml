{{- range $key, $value := .Values.kafkaConsumers }}
{{- if $value.enabled }}
{{- include "telegraf.validateTopicDiscovery" (dict "key" $key "value" $value) }}
{{- $topicDiscovery := default dict $value.topicDiscovery }}
{{- $discoveryEnabled := default false $topicDiscovery.enabled }}
{{- $passwordEnv := list }}
{{- if $discoveryEnabled }}
  {{- range $.Values.env }}
    {{- if eq .name "TELEGRAF_PASSWORD" }}
      {{- $passwordEnv = append $passwordEnv . }}
    {{- end }}
  {{- end }}
  {{- if and (eq (len $passwordEnv) 0) $.Values.envFromSecret }}
    {{- $passwordEnv = append $passwordEnv (dict
      "name" "TELEGRAF_PASSWORD"
      "valueFrom" (dict
        "secretKeyRef" (dict
          "name" $.Values.envFromSecret
          "key" "TELEGRAF_PASSWORD"
        )
      )
    ) }}
  {{- end }}
  {{- if eq (len $passwordEnv) 0 }}
    {{- fail (printf "kafkaConsumers.%s.topicDiscovery requires TELEGRAF_PASSWORD in env or envFromSecret" $key) }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sasquatch-telegraf-{{ $key }}
  labels:
    app.kubernetes.io/name: sasquatch-telegraf
    app.kubernetes.io/instance: sasquatch-telegraf-{{ $key }}
    app.kubernetes.io/part-of: sasquatch
spec:
  replicas: {{ default 1 $value.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: sasquatch-telegraf-{{ $key }}
  template:
    metadata:
      labels:
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/name: sasquatch-telegraf
        app.kubernetes.io/instance: sasquatch-telegraf-{{ $key }}
      annotations:
        checksum/config: {{ include "configmap" (dict "key" $key "value" $value "influxdbUrls" $.Values.influxdb.urls "registryUrl" $.Values.registry.url "kafkaVersion" $.Values.kafkaVersion) | sha256sum }}
        {{- if $.Values.podAnnotations }}
        {{- toYaml $.Values.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        {{- if $discoveryEnabled }}
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      containers:
      - name: telegraf
        securityContext:
          capabilities:
            drop:
              - all
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        image: "{{ $.Values.image.repo }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
        imagePullPolicy: {{ default "IfNotPresent" $.Values.image.pullPolicy | quote }}
        {{- if $.Values.resources }}
        resources:
          {{- toYaml (default $.Values.resources $value.resources) | nindent 10 }}
        {{- end }}
        {{- if $discoveryEnabled }}
        args:
          - "--config"
          - "/etc/telegraf-static/telegraf.conf"
          - "--config-directory"
          - "/etc/telegraf-dynamic"
          - "--watch-config"
          - "notify"
          - "--watch-debounce-interval"
          - "1s"
          {{- with $.Values.args }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- else if $.Values.args }}
        args:
          {{- toYaml $.Values.args | nindent 8 }}
        {{- end }}
        {{- if $.Values.env }}
        env:
          {{- toYaml $.Values.env | nindent 8 }}
        {{- end }}
        {{- if $.Values.envFromSecret }}
        envFrom:
          - secretRef:
              name: {{ $.Values.envFromSecret }}
        {{- end }}
        volumeMounts:
        - name: config
          {{- if $discoveryEnabled }}
          mountPath: /etc/telegraf-static
          readOnly: true
          {{- else }}
          mountPath: /etc/telegraf
          {{- end }}
        {{- if $discoveryEnabled }}
        - name: dynamic-config
          mountPath: /etc/telegraf-dynamic
      - name: topic-discovery
        securityContext:
          capabilities:
            drop:
              - all
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        image: "{{ $.Values.topicDiscovery.image.repo }}:{{ $.Values.topicDiscovery.image.tag }}"
        imagePullPolicy: {{ $.Values.topicDiscovery.image.pullPolicy | quote }}
        command:
          - "sasquatch"
          - "telegraf"
          - "update-topic-config"
        args:
          - "--watch"
          - "--bootstrap-server"
          - "sasquatch-kafka-brokers.sasquatch:9092"
          - "--include-prefixes-file"
          - "/etc/telegraf-static/include-prefixes.txt"
          - "--exclude-prefixes-file"
          - "/etc/telegraf-static/exclude-prefixes.txt"
          - "--input-template"
          - "/etc/telegraf-static/kafka-consumer.conf.tmpl"
          - "--output-config"
          - "/etc/telegraf-dynamic/kafka-consumer.conf"
          - "--ready-file"
          - "/var/run/topic-discovery/ready"
          - "--refresh-interval"
          - {{ default "30s" $topicDiscovery.refreshInterval | quote }}
        {{- with $passwordEnv }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml $.Values.topicDiscovery.resources | nindent 10 }}
        readinessProbe:
          exec:
            command:
              - "test"
              - "-f"
              - "/var/run/topic-discovery/ready"
          periodSeconds: 5
          failureThreshold: 3
        volumeMounts:
          - name: config
            mountPath: /etc/telegraf-static
            readOnly: true
          - name: dynamic-config
            mountPath: /etc/telegraf-dynamic
          - name: topic-discovery-runtime
            mountPath: /var/run/topic-discovery
        {{- end }}
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $.Values.affinity }}
      affinity:
        {{- toYaml $.Values.affinity | nindent 8 }}
      {{- end }}
      {{- if $.Values.tolerations }}
      tolerations:
        {{- toYaml $.Values.tolerations | nindent 8 }}
      {{- end }}
      volumes:
      - name: config
        configMap:
          name: sasquatch-telegraf-{{ $key }}
      {{- if $discoveryEnabled }}
      - name: dynamic-config
        emptyDir: {}
      - name: topic-discovery-runtime
        emptyDir: {}
      {{- end }}
{{- end }}
{{- end }}
