## Default values.yaml for the Observatory Control System subchart

cluster:
  # -- Name of the Strimzi cluster. Synchronize this with the cluster name in
  # the parent Sasquatch chart.
  name: sasquatch

# -- Create lsst.s3.* related topics for the ts-salkafka user.
topics: []

cephNotifier:
  # -- Enable the ceph-rgw user (authenticates via SASL PLAIN on the
  # cephplain listener)
  enabled: false

  # -- Topics that Ceph RGW bucket notifications are allowed to write to
  topics: []
