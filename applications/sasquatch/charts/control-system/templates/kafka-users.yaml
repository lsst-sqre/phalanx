---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: ts-salkafka
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: sasquatch
          key: ts-salkafka-password
  authorization:
    type: simple
    acls:
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - All
      - resource:
          type: topic
          name: "lsst.sal"
          patternType: prefix
        type: allow
        host: "*"
        operations:
          - All
      - resource:
          type: topic
          name: "lsst.s3"
          patternType: prefix
        type: allow
        host: "*"
        operations:
          - All
      - resource:
          type: cluster
        operations:
          - Describe
          - DescribeConfigs
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: camera
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: sasquatch
          key: camera-password
  authorization:
    type: simple
    acls:
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - All
      - resource:
          type: topic
          name: "lsst.ATCamera"
          patternType: prefix
        type: allow
        host: "*"
        operations:
          - All
      - resource:
          type: topic
          name: "lsst.CCCamera"
          patternType: prefix
        type: allow
        host: "*"
        operations:
          - All
      - resource:
          type: topic
          name: "lsst.MTCamera"
          patternType: prefix
        type: allow
        host: "*"
        operations:
          - All
      - resource:
          type: cluster
        operations:
          - Describe
          - DescribeConfigs
{{- if .Values.cephNotifier.enabled }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: ceph-rgw
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  # No authentication block: ceph-rgw authenticates via SASL PLAIN on the
  # cephplain listener (JAAS config). This KafkaUser only manages its ACLs.
  authorization:
    type: simple
    acls:
    {{- range .Values.cephNotifier.topics }}
      - resource:
          type: topic
          name: {{ . | quote }}
          patternType: literal
        type: allow
        host: "*"
        operations:
          - Write
          - Describe
    {{- end }}
{{- end }}