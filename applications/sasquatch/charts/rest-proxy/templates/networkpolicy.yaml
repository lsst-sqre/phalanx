apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "rest-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rest-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Allow DNS lookups through the cluster DNS service.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow connections to the Kafka brokers.
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ .Values.kafka.cluster.name }}
              strimzi.io/broker-role: "true"
              strimzi.io/component-type: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Allow connections only to the local Schema Registry. The remote Schema
    # Registry has a different app label and is therefore not reachable.
    - to:
        - podSelector:
            matchLabels:
              app: {{ printf "%s-schema-registry" .Release.Name }}
      ports:
        - protocol: TCP
          port: 8081
