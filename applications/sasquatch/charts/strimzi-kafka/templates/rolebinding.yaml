{{- if .Values.kafka.listeners.cephplain.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.cluster.name }}-cephplain-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.cluster.name }}-kafka
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.cluster.name }}-cephplain-secret-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}