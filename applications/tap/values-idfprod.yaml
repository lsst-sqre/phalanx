cadc-tap:
  replicaCount: 4

  config:
    kafka:
      enabled: true

    urlRewrite:
      enabled: true
      rules:
        - "ivoa.ObsCore:access_url"
        - "dp02_dc2_catalogs.ObsCore:access_url"
        - "dp1.ObsCore:access_url"

    datalinkPayloadUrl: "https://github.com/lsst/sdm_schemas/releases/download/EDP2-deploy-v2/datalink-snippets.zip"

  cloudsql:
    enabled: true
    instanceConnectionName: "science-platform-stable-6994:us-central1:science-platform-stable-0c29612b"
    serviceAccount: "tap-service@science-platform-stable-6994.iam.gserviceaccount.com"
    database: "tap"

  uws:
    maxActive: 20
