suite: Loki credentials
# The application has no credentials panel, so this is the only way it can
# authenticate to Loki. One process serves every user of a deployment.
set:
  global:
    host: "example.com"
    vaultSecretsPath: "secret/phalanx/test"
values:
  - "../values-base.yaml"
tests:
  - it: "reads the password from the Vault secret by default"
    template: "deployment.yaml"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: "LOKI_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: "log-explorer"
                key: "loki-password"
                optional: true

  - it: "starts even before the Vault secret exists"
    template: "deployment.yaml"
    asserts:
      # Without `optional` the container sits in CreateContainerConfigError
      # and nothing at all can be checked — not the ingress, not the probe,
      # not the UI. Degrading is safe rather than silent here: the
      # application refuses to run logcli with no password and says so, so a
      # missing secret surfaces as a legible error on the first fetch.
      - equal:
          path: "spec.template.spec.containers[0].env[?(@.name=='LOKI_PASSWORD')].valueFrom.secretKeyRef.optional"
          value: true

  - it: "takes a literal password when one is supplied for bring-up"
    template: "deployment.yaml"
    set:
      config:
        lokiPassword: "interim-value"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: "LOKI_PASSWORD"
            value: "interim-value"
      - notContains:
          path: "spec.template.spec.containers[0].env"
          any: true
          content:
            name: "LOKI_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: "log-explorer"
                key: "loki-password"
                optional: true

  - it: "ships no literal password in any committed values file"
    template: "deployment.yaml"
    values:
      - "../values-base.yaml"
    asserts:
      # This repository is public. `config.lokiPassword` exists to be passed
      # as a parameter override during bring-up and cleared afterwards; a
      # value reaching a committed values file is a leaked credential.
      - equal:
          path: "spec.template.spec.containers[0].env[?(@.name=='LOKI_PASSWORD')].valueFrom.secretKeyRef.name"
          value: "log-explorer"

  - it: "ships no literal password on the summit either"
    template: "deployment.yaml"
    values:
      - "../values-summit.yaml"
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].env[?(@.name=='LOKI_PASSWORD')].valueFrom.secretKeyRef.name"
          value: "log-explorer"

  - it: "declares the secret it expects Vault to hold"
    template: "vault-secrets.yaml"
    asserts:
      - equal:
          path: "spec.path"
          value: "secret/phalanx/test/log-explorer"
