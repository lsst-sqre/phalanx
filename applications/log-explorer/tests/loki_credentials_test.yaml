suite: Loki credentials
# The application has no credentials panel, so this is the only way it can
# authenticate to Loki. One process serves every user of a deployment.
set:
  global:
    host: "example.com"
    vaultSecretsPath: "secret/phalanx/test"
values:
  - "../values-base.yaml"
tests:
  - it: "reads the password from the Vault secret"
    template: "deployment.yaml"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: "LOKI_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: "log-explorer"
                key: "loki-password"
                optional: true

  - it: "starts even before the Vault secret exists"
    template: "deployment.yaml"
    asserts:
      # Without `optional` the container sits in CreateContainerConfigError
      # and nothing at all can be checked — not the ingress, not the probe,
      # not the UI. Degrading is safe rather than silent here: the
      # application refuses to run logcli with no password and says so, so a
      # missing secret surfaces as a legible error on the first fetch. This
      # is what a new environment is brought up on; there is deliberately no
      # way to hand the chart a password in the clear.
      - equal:
          path: "spec.template.spec.containers[0].env[?(@.name=='LOKI_PASSWORD')].valueFrom.secretKeyRef.optional"
          value: true

  - it: "takes the password from the secret and nowhere else"
    template: "deployment.yaml"
    asserts:
      # This repository is public, and an env var set from a value also
      # shows in plain text in `kubectl describe pod` and the Argo CD UI.
      # Guards against a literal path being reintroduced for bring-up: the
      # `optional` secret above already covers that case.
      - notExists:
          path: "spec.template.spec.containers[0].env[?(@.name=='LOKI_PASSWORD')].value"

  - it: "takes it from the secret on the summit too"
    template: "deployment.yaml"
    values:
      - "../values-summit.yaml"
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].env[?(@.name=='LOKI_PASSWORD')].valueFrom.secretKeyRef.name"
          value: "log-explorer"
      - notExists:
          path: "spec.template.spec.containers[0].env[?(@.name=='LOKI_PASSWORD')].value"

  - it: "declares the secret it expects Vault to hold"
    template: "vault-secrets.yaml"
    asserts:
      - equal:
          path: "spec.path"
          value: "secret/phalanx/test/log-explorer"
