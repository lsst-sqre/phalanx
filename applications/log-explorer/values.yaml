# Default values for log-explorer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of web deployment pods to start. Must stay at 1: the log cache
# is a ReadWriteOnce volume, and loaded exposures live in the serving
# process's memory, so a second replica would answer with different state
# depending on which pod the request landed on.
replicaCount: 1

image:
  # -- Image to use in the log-explorer deployment
  repository: "ghcr.io/lsst-so/ra_log_explorer"

  # -- Pull policy for the log-explorer image
  pullPolicy: "IfNotPresent"

  # -- Tag of image to use
  # @default -- The appVersion of the chart
  tag: null

# -- Image pull secrets. Needed only if the GHCR package is made private; a
# public package pulls without credentials.
# @default -- See `values.yaml`
imagePullSecrets: []
# Each entry is of the form: { name: pull-secret-name }

ingress:
  # -- Additional annotations for the ingress rule
  annotations: {}

  # -- Path the app is served under. Passed to the application as
  # `RA_LOG_EXPLORER_BASE_PATH` as well as being the ingress path, so the
  # URLs it serves and the URLs the ingress routes cannot drift apart.
  path: "/log-explorer"

config:
  # -- Loki HTTP basic-auth username. The password comes from the
  # `loki-password` Vault secret. Both are set server-side because the
  # application takes no configuration from the browser at all: one process
  # serves every user, so a credentials field would let whoever filled it
  # in last break fetches for everybody else.
  lokiUsername: "omega"

  # -- Loki password in the clear, for bringing an environment up before
  # its Vault secret exists. **Do not commit a real value**: this repository
  # is public, and anything set here also shows in plain text in `kubectl
  # describe pod` and the Argo CD UI. Pass it as a Helm parameter override
  # on the Argo CD Application instead, and clear it once the `loki-password`
  # Vault secret is populated. Empty (the normal state) reads the password
  # from that secret, and the pod starts either way — with neither, log
  # fetches fail with a legible error and the rest of the app works.
  lokiPassword: ""

  # -- Parallel log-download workers per fetch. Each is a `logcli` process
  # streaming one pod's window, so this trades cluster load and pod CPU
  # against how long a night-wide fetch takes.
  workers: 8

  # -- Seconds before shutter close that a fetch window starts. This is the
  # *starting* value of an editable field, not a cap: widening a window to
  # catch a neighbouring exposure is a normal investigative move.
  windowBeforeS: 5

  # -- Seconds after shutter close that a fetch window ends. As above, a
  # starting value rather than a cap. Worth raising where the pipeline runs
  # slower than the exposure cadence.
  windowAfterS: 300

  # -- The one site this deployment serves. A *site* pairs a Loki cluster
  # (where the logs live) with the ConsDB endpoint that owns shutter-close
  # truth for that cluster's data; the two must match or a dataId resolves
  # against the wrong observatory. Singular on purpose: an instance on
  # manke *is* BTS and one on yagan *is* the summit, and because the same
  # 13-digit dataId exists at both with different obs_end values, an
  # instance that could be pointed at the other one would return answers
  # that looked plausible rather than obviously wrong. Needs `name`,
  # `cluster`, `namespace`, `lokiAddr` and `consdbUrl`; `consdbTokenFile`
  # is omitted because an in-cluster ConsDB Service address never passes
  # through Gafaelfawr and so takes no bearer token. Rendered into the
  # `sites.toml` the application reads.
  # @default -- See the per-environment values files
  site: {}

# -- Persistent volume for the log cache. Fetching a night out of Loki takes
# minutes, so the cache is what makes the tool usable a second time; an
# emptyDir would throw it away on every pod restart.
# @default -- See `values.yaml`
cache:
  # -- Storage class for the cache volume
  storageClassName: "rook-ceph-block"

  # -- Size of the cache volume, in GiB. Given as a bare number rather than
  # a quantity string because it sets two things that must not disagree: the
  # volume's size, and the byte ceiling the application's LRU eviction keeps
  # the cache under (`usagePercent` of it). Deriving both from one value is
  # what stops the app happily filling a disk it thinks is bigger than it is.
  sizeGi: 50

  # -- Percentage of the volume the application will fill before it starts
  # evicting least-recently-used windows. The headroom covers filesystem
  # overhead and the gap between a fetch finishing and the eviction sweep
  # that follows it — the cache is briefly over its ceiling in between.
  usagePercent: 85

  # -- Where the cache volume is mounted, and what the application is told
  # to use as its cache root.
  mountPath: "/var/cache/ra-log-explorer"

# -- Affinity rules for the log-explorer deployment pod
affinity: {}

# -- Node selection rules for the log-explorer deployment pod
nodeSelector: {}

# -- Annotations for the log-explorer deployment pod
podAnnotations: {}

# -- Resource limits and requests for the log-explorer deployment pod
# @default -- See `values.yaml`
resources:
  requests:
    cpu: 0.5
    memory: "2Gi"
  limits:
    # a night-wide fetch runs several logcli downloads in parallel and then
    # parses every pod's logs into memory, so both ceilings are set by that
    # rather than by steady-state browsing
    cpu: 4
    memory: "8Gi"

# -- Tolerations for the log-explorer deployment pod
tolerations: []

# The following will be set by parameters injected by Argo CD and should not
# be set in the individual environment values files.
global:
  # -- Host name for ingress
  # @default -- Set by Argo CD
  host: null

  # -- Base path for Vault secrets
  # @default -- Set by Argo CD
  vaultSecretsPath: null
