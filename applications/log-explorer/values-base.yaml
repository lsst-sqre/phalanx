config:
  # Base Test Stand: logs come from the manke cluster and shutter-close truth
  # from the ConsDB running alongside them on this same cluster. Reached at
  # its Service address, so the request never passes through Gafaelfawr and
  # no bearer token is needed.
  site:
    name: "bts"
    cluster: "manke"
    namespace: "rapid-analysis"
    lokiAddr: "https://loki-query.ls.lsst.org"
    consdbUrl: "http://consdb-pq.consdb.svc.cluster.local:8080/consdb/query"

image:
  # Pinned per site, so each one moves to a new release on its own.
  # Testing the DM-56855 branch build: revert to a release tag, and drop
  # Always, before merging. A branch tag is overwritten on every push.
  tag: "tickets-DM-56855"
  pullPolicy: "Always"
