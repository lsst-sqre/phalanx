apiVersion: gafaelfawr.lsst.io/v1alpha1
kind: GafaelfawrIngress
metadata:
  name: "log-explorer"
  labels:
    {{- include "log-explorer.labels" . | nindent 4 }}
config:
  # a browser app rather than an API client: send anonymous users to log in
  # rather than answering them with a 401 they cannot act on
  loginRedirect: true
  scopes:
    all:
      - "read:image"
  service: "log-explorer"
template:
  metadata:
    name: "log-explorer"
    annotations:
      # the fetch-progress endpoint streams Server-Sent Events for the
      # duration of a fetch, which for a whole night runs to minutes. With
      # nginx's default response buffering the browser sees none of it until
      # the fetch has already finished, so the progress display looks frozen
      # exactly when the user most wants to know something is happening
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      {{- with .Values.ingress.annotations }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  spec:
    rules:
      - host: {{ required "global.host must be set" .Values.global.host | quote }}
        http:
          paths:
            - path: {{ .Values.ingress.path | quote }}
              pathType: "Prefix"
              backend:
                service:
                  name: "log-explorer"
                  port:
                    number: 8080
