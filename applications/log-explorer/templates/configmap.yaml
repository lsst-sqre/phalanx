apiVersion: v1
kind: ConfigMap
metadata:
  name: "log-explorer-sites"
  labels:
    {{- include "log-explorer.labels" . | nindent 4 }}
data:
  # The application's site catalog, pointed at by RA_LOG_EXPLORER_SITES_FILE.
  # A site pairs a Loki cluster with the ConsDB that owns shutter-close truth
  # for that cluster's data. `consdbTokenFile` is omitted for an in-cluster
  # ConsDB Service address: that never passes through Gafaelfawr, so there is
  # no bearer token to send.
  sites.toml: |
    default_site = {{ .Values.config.defaultSite | default (first .Values.config.sites).name | quote }}
    {{- range .Values.config.sites }}

    [[site]]
    name = {{ .name | quote }}
    cluster = {{ .cluster | quote }}
    namespace = {{ .namespace | quote }}
    lokiAddr = {{ .lokiAddr | quote }}
    consdbUrl = {{ .consdbUrl | quote }}
    {{- with .consdbTokenFile }}
    consdbTokenFile = {{ . | quote }}
    {{- end }}
    {{- end }}
