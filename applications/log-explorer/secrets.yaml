"loki-password":
  description: >-
    Password for the HTTP basic-auth account the application uses to query
    the observatory's Loki (loki-query.ls.lsst.org) through logcli. The
    matching username is the `config.lokiUsername` Helm value, not a secret.
    Setting this server-side is what lets a user open the tool and fetch
    logs without holding Loki credentials of their own. There is no
    per-user override: one process serves everybody, so the application
    ignores credentials sent in a request body rather than let one
    browser's wrong password break fetches for the rest. The account is
    read-only against Loki: the tool only ever runs queries.
