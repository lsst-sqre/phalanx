apiVersion: gafaelfawr.lsst.io/v1alpha1
kind: GafaelfawrIngress
metadata:
  name: {{ template "squareone.fullname" . }}-times-square
  labels:
    {{- include "squareone.labels" . | nindent 4 }}
config:
  loginRedirect: true
  scopes:
    all:
      - {{ .Values.ingress.timesSquareScope | quote }}
  delegate:
    internal:
      scopes:
        {{- toYaml (required "ingress.delegateScopes must be a non-empty list" .Values.ingress.delegateScopes) | nindent 8 }}
  service: "squareone"
template:
  metadata:
    name: {{ template "squareone.fullname" . }}-times-square
    {{- with .Values.ingress.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  spec:
    rules:
      - host: {{ required "global.host must be set" .Values.global.host | quote }}
        http:
          paths:
            - path: "/times-square"
              pathType: "Prefix"
              backend:
                service:
                  name: {{ template "squareone.fullname" . }}
                  port:
                    number: 80
