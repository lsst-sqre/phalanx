# Default values for squareone.

# -- Number of squareone pods to run in the deployment.
replicaCount: 1

image:
  # -- Squareone Docker image repository
  repository: ghcr.io/lsst-sqre/squareone

  # -- Image pull policy (tip: use Always for development)
  pullPolicy: IfNotPresent

  # -- Overrides the image tag.
  # @default -- Chart's appVersion
  tag: ""

# -- Overrides the base name for resources
nameOverride: ""

# -- Overrides the full name for resources (includes the release name)
fullnameOverride: ""

# -- Annotations for squareone pods
podAnnotations: {}

ingress:
  # -- Enable ingress
  enabled: true

  # -- Additional annotations to add to the ingress
  annotations: {}

  # -- Scope required for /times-square UI
  timesSquareScope: "exec:notebook"

  # -- Scopes that grant access to the /admin UI. Holding any one of them is
  # sufficient; which admin pages each scope reveals is decided by Squareone's
  # own `adminPageScopes` configuration.
  adminScopes:
    - "exec:admin"
    - "admin:notifications"
    - "admin:token"
    - "admin:oidc"

  # -- Scopes requested for the internal token Gafaelfawr delegates to
  # Squareone on the /times-square and /admin ingresses
  # (`config.delegate.internal.scopes`). Gafaelfawr strips its session cookie
  # from requests crossing a `GafaelfawrIngress`, so Squareone's server-side
  # prefetch of the signed-in user's scopes reads them back from this token
  # instead. A delegated token only carries the requested scopes the user
  # actually holds, so this list must cover every scope the UI gates on:
  # it defaults to Gafaelfawr's full known-scope list, and an environment
  # that defines extra scopes in its Gafaelfawr `config.knownScopes` should
  # add them here. (A Gafaelfawr request header carrying the user's scopes
  # would make this list unnecessary; that has not been requested.)
  # @default -- Gafaelfawr's default known scopes; see `values.yaml`
  delegateScopes:
    - "admin:jupyterlab"
    - "admin:notifications"
    - "admin:oidc"
    - "admin:token"
    - "admin:userinfo"
    - "exec:admin"
    - "exec:internal-tools"
    - "exec:notebook"
    - "exec:portal"
    - "exec:portal-admin"
    - "read:image"
    - "read:sasquatch"
    - "read:tap"
    - "user:token"
    - "write:files"
    - "write:notifications"
    - "write:obsforge"
    - "write:sasquatch"

# -- Resource requests and limits for Squareone pods
# @default -- see `values.yaml`
resources:
  limits:
    cpu: "1"
    memory: "1Gi"
  requests:
    cpu: "50m"
    memory: "200Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

# Tolerations for squareone pod
# @default -- Tolerate GKE amd64 and arm64 taints
tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "amd64"
    effect: "NoSchedule"
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"

affinity: {}

# Squareone app configuration
config:
  # -- Name of the site, used in the title and meta tags. Set this only to
  # override the environment's title from Repertoire service discovery.
  # @default -- The environment title from Repertoire service discovery, else "Rubin Science Platform"
  siteName: null

  # -- Omit `baseUrl` and `environmentName` from the Squareone configuration
  # so that Squareone derives them from Repertoire service discovery (the
  # `squareone` UI service URL and `environment.label`). Requires Repertoire
  # 3.0 or later. Set to `false` to render them from `global.baseUrl` and
  # `global.environmentName` instead.
  useDiscoveryDefaults: true

  # -- Site description, used in meta tags
  # @default -- See `values.yaml`
  siteDescription: |
    Access Rubin Observatory Legacy Survey of Space and Time data.

  # -- Base URL for user documentation (excludes trailing slash)
  docsBaseUrl: "https://rsp.lsst.io"

  # -- Show a "preview" badge in the homepage
  showPreview: true

  # -- Enable the user-facing notifications UI: the unread badge in the header
  # user menu and the /notifications inbox and detail pages. Squareone finds
  # the Semaphore API through Repertoire service discovery, so the
  # `semaphore` application must be enabled in the environment.
  enableUserNotifications: false

  # -- Background polling cadence, in seconds, for the unread notification count
  # in the header user menu. Only relevant when enableUserNotifications is true.
  userNotificationsPollIntervalSeconds: 300

  # -- URL to the Times Square (parameterized notebooks) API service.
  # @default -- null disables the Times Square integration
  timesSquareUrl: null

  # -- Plausible tracking domain. For example, `data.lsst.cloud`.
  # @default -- null disables Plausible tracking
  plausibleDomain: null

  # -- Enable Sentry
  enableSentry: false

  # -- Sentry DSN
  sentryDsn: null

  # -- Sentry traces sample rate
  sentryTracesSampleRate: 0

  # -- Sentry replays sample rate
  sentryReplaysSessionSampleRate: 0

  # -- Sentry error replays sample rate
  sentryReplaysOnErrorSampleRate: 0

  # -- Sentry debug mode
  sentryDebug: false

  # -- Maps each admin page id (`notifications`, `serviceTokens`,
  # `oidcClients`, `sentry`) to the Gafaelfawr scopes granting access to it.
  # Holding any one of a page's scopes is sufficient; an empty list hides the
  # page. Override only the pages that differ — the rest keep their defaults.
  # Keep this consistent with `ingress.adminScopes`, which decides who gets
  # past the /admin ingress at all.
  adminPageScopes:
    notifications: ["admin:notifications"]
    serviceTokens: ["admin:token"]
    oidcClients: ["admin:oidc"]
    sentry: ["exec:admin"]

  # -- Enable the Apps menu in the header. Its items come from Repertoire
  # service discovery: Times Square when that application is enabled, and the
  # Argo CD, Chronograf, Kafdrop, and WebDAV UI services, each shown only to
  # users with the scopes the service requires.
  enableAppsMenu: false

  # -- Additional Apps menu items for applications that service discovery
  # does not describe. Each item has a `label`, an `href`, and `internal`
  # (true for a Squareone route, false for another application). Items whose
  # `href` duplicates a discovered service are dropped.
  appLinks: []

  # -- URL to an external header logo image (HTTPS only). Takes priority over
  # headerLogoFile and headerLogoData.
  # @default -- null uses Squareone's default built-in logo
  headerLogoUrl: null

  # -- Filename of a logo image in the content/{environment}/ directory
  # (e.g., "header-logo.png"). The file will be base64-encoded automatically.
  # Used only if headerLogoUrl is null. Supported formats: .png, .jpg, .jpeg,
  # .svg, .webp, .gif. Note: unlike MDX files, logo files do NOT fall back to
  # idfprod if not found in the environment directory.
  # @default -- null uses Squareone's default built-in logo
  headerLogoFile: null

  # -- Base64-encoded image data for header logo (without data URL prefix).
  # Must be used with headerLogoMimeType. Used only if both headerLogoUrl and
  # headerLogoFile are null.
  # @default -- null uses Squareone's default built-in logo
  headerLogoData: null

  # -- MIME type for base64-encoded logo data (e.g., 'image/png',
  # 'image/svg+xml'). Required when headerLogoData is provided.
  headerLogoMimeType: null

  # -- Height of header logo in pixels
  headerLogoHeight: 50

  # -- Width of header logo in pixels. If not provided, maintains aspect ratio
  # based on height.
  # @default -- null maintains aspect ratio
  headerLogoWidth: null

  # -- Alternative text for header logo for accessibility
  headerLogoAlt: "Logo"

# Global parameters are set by parameters injected by the Argo CD Application
# and should not be set in the individual environment values files.
global:
  # -- Base URL for the environment
  # @default -- Set by Argo CD Application
  baseUrl: null

  # -- Name of the Phalanx environment
  # @default -- Set by Argo CD Application
  environmentName: null

  # -- Host name for ingress
  # @default -- Set by Argo CD Application
  host: null

  # -- Base path for Vault secrets
  # @default -- Set by Argo CD Application
  vaultSecretsPathPrefix: null

  # -- Base URL for Repertoire discovery API
  # @default -- Set by Argo CD
  repertoireUrl: null
