redis:
  persistence:
    size: "100Gi"
    storageClass: "wekafs--sdf-k8s01"

  resources:
    limits:
      cpu: "1"
      memory: "4Gi"
    requests:
      cpu: "1"
      memory: "1Gi"

redis-stream-exporter:
  enabled: true
  sleepInterval: 2

  resources:
    limits:
      cpu: "1"
      memory: "4Gi"
    requests:
      cpu: "1"
      memory: "4Gi"

redis-streams-cleaner:
  enabled: true
  image:
    tag: main
  streams: "instrument:lsstcam=lsstcam_consumer_group"
  idleThreshold: "900000" # 15 minutes

  resources:
    limits:
      cpu: "1"
      memory: "4Gi"
    requests:
      cpu: "1"
      memory: "4Gi"
