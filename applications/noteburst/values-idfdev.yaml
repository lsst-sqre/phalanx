image:
  pullPolicy: Always
  # Temporary branch deployment for DM-55928; replace with the 0.27.1
  # release image (and drop this override) once it is published.
  tag: "tickets-DM-55928-timeout-reporting"

config:
  logLevel: "DEBUG"
  metrics:
    enabled: true
  sentry:
    enabled: true
    tracesSampleRate: 1
  worker:
    workerCount: 1
    imageSelector: "weekly"
    identities:
      - username: "bot-noteburst90000"
      - username: "bot-noteburst90001"
      - username: "bot-noteburst90002"
      - username: "bot-noteburst90003"
      - username: "bot-noteburst90004"
      - username: "bot-noteburst90005"

# Use SSD for Redis storage.
redis:
  persistence:
    storageClass: "premium-rwo"
