# The base URL is spelled out rather than derived from the injected
# `global.baseUrl`, so that a bare `helm template` of this environment produces
# exactly the URL the service is reached at.
config:
  baseUrl: "https://usdf-rsp-dev.slac.stanford.edu/shiny"

  branding:
    name: "Shiny"

config:
  # Phase 3: Gafaelfawr authenticates at the ingress; mppdb JIT-provisions its
  # internal account on first sight of the username header.
  authProvider: "gafaelfawr"

  # Behind the TLS-terminating RSP ingress: pin every generated URL to the
  # external https baseUrl so async job/result URLs are not minted as http://
  # (which the https console blocks under connect-src 'self').
  advertiseRequestBase: false

image:
  pullSecrets: ["shiny-pull"]
  # sha- tag of the u/mjuric/shiny merge that contains both the OCI build and
  # the gafaelfawr provider (mppdb b439931); CI's in-image test gate passed.
  tag: "sha-de400ae"
  pullPolicy: "Always"
