apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "mppdb-data"
  labels:
    {{- include "mppdb.labels" . | nindent 4 }}
  annotations:
    # This volume holds the only copy of the service's state: the SQLite state
    # database, the result spool, and the snapshot manifests. Deleting the claim
    # destroys all of it, so neither Argo CD's pruning nor a Helm uninstall is
    # allowed to take it. Reclaiming it is a deliberate manual act.
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep
spec:
  accessModes:
    # ReadWriteOnce, not ReadWriteMany: a single writer is the whole point. The
    # Deployment is pinned to one replica with the Recreate strategy for the
    # same reason.
    - "ReadWriteOnce"
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
