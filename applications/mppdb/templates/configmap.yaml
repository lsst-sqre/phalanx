apiVersion: v1
kind: ConfigMap
metadata:
  name: "mppdb"
  labels:
    {{- include "mppdb.labels" . | nindent 4 }}
data:
  # The service reads its [databases] catalog only from this file; every flat
  # scalar setting is passed as an environment variable by the Deployment.
  mppdb.toml: |
    {{- include "mppdb.mppdbToml" . | nindent 4 }}
