MPPDB_CLICKHOUSE_USER:
  description: >-
    Username for the external ClickHouse server that answers ADQL queries. The
    account is read-only. The key is named after the environment variable
    because the pod consumes this secret with envFrom.
  if: config.useVaultSecret
MPPDB_CLICKHOUSE_PASSWORD:
  description: >-
    Password for the external ClickHouse server that answers ADQL queries.
  if: config.useVaultSecret
