apiVersion: gafaelfawr.lsst.io/v1alpha1
kind: GafaelfawrIngress
metadata:
  name: "river"
  labels:
    {{- include "river.labels" . | nindent 4 }}
config:
  # Basic auth challenges, as for every other TAP service in Phalanx, so that
  # VO clients that only speak HTTP basic can send a token as the password.
  authType: {{ .Values.ingress.authType | quote }}
  # Authenticated only. There is no anonymous ingress for this service, by
  # design: the NetworkPolicy blocks everything that does not arrive through
  # ingress-nginx, so this is the only way in.
  scopes:
    all:
      - {{ .Values.ingress.scope | quote }}
  service: "river"
  delegate:
    internal:
      service: "river"
      scopes: []
    useAuthorization: {{ .Values.ingress.useAuthorization }}
template:
  metadata:
    name: "river"
    annotations:
      # The service serves at the root of its own URL space and has no path
      # prefix setting, so the prefix is rewritten away here, the same way
      # usertap and the shared cadc-tap chart do it.
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: "/$2"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: {{ .Values.ingress.timeout | quote }}
      nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.timeout | quote }}
      nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.timeout | quote }}
      {{- with .Values.ingress.annotations }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  spec:
    rules:
      - host: {{ required "global.host must be set" .Values.global.host | quote }}
        http:
          paths:
            # Must not match the bare prefix: river-ui owns that.
            # Every real API path has a non-empty segment after the slash.
            - path: "{{ .Values.ingress.pathPrefix }}(/)(.+)"
              pathType: "ImplementationSpecific"
              backend:
                service:
                  name: "river"
                  port:
                    number: {{ .Values.config.port }}
