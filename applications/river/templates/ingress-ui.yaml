apiVersion: gafaelfawr.lsst.io/v1alpha1
kind: GafaelfawrIngress
metadata:
  name: "river-ui"
  labels:
    {{- include "river.labels" . | nindent 4 }}
config:
  # The browser surface. NO authType here, deliberately: authType "basic" makes
  # Gafaelfawr answer an unauthenticated request with
  # `401 WWW-Authenticate: Basic`, which a browser renders as a username and
  # password dialog that an SSO password cannot satisfy. loginRedirect sends the
  # browser to Rubin SSO instead, as every other browser-facing Phalanx app does.
  loginRedirect: true
  scopes:
    all:
      - {{ .Values.ingress.scope | quote }}
  service: "river"
  delegate:
    internal:
      service: "river"
      scopes: []
    useAuthorization: {{ .Values.ingress.useAuthorization }}
template:
  metadata:
    name: "river-ui"
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: "/$2"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: {{ .Values.ingress.timeout | quote }}
      nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.timeout | quote }}
      nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.timeout | quote }}
      {{- with .Values.ingress.annotations }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  spec:
    rules:
      - host: {{ required "global.host must be set" .Values.global.host | quote }}
        http:
          paths:
            # The console and the admin UI, plus the bare prefix, which is the
            # URL people are given and which serves the console.
            - path: "{{ .Values.ingress.pathPrefix }}(/|$)((?:ui|admin).*)"
              pathType: "ImplementationSpecific"
              backend:
                service:
                  name: "river"
                  port:
                    number: {{ .Values.config.port }}
            - path: "{{ .Values.ingress.pathPrefix }}(/?)()$"
              pathType: "ImplementationSpecific"
              backend:
                service:
                  name: "river"
                  port:
                    number: {{ .Values.config.port }}
