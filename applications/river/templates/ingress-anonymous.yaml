apiVersion: gafaelfawr.lsst.io/v1alpha1
kind: GafaelfawrIngress
metadata:
  name: "river-anonymous"
  labels:
    {{- include "river.labels" . | nindent 4 }}
config:
  # The service treats these as anonymous itself (ANON_ALLOWLIST plus the /dl/
  # prefix), so requiring a credential at the ingress only breaks them:
  #
  #  * /capabilities and /availability are VOSI metadata. IVOA clients and
  #    taplint read them before holding any credential; sia exposes exactly
  #    these two anonymously for the same reason.
  #  * /dl/<token> is a capability URL whose 256-bit token IS the
  #    authorization, handed to curl, wget or a browser download manager that
  #    has no session. Behind auth the download-link feature cannot work at all.
  #  * /catalog reports only a generation and per-schema digests, and
  #    `mppdb reload --wait` polls it; requiring a credential there just means
  #    handing one to the reload tool.
  scopes:
    anonymous: true
template:
  metadata:
    name: "river-anonymous"
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: "/$2"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      {{- with .Values.ingress.annotations }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  spec:
    rules:
      - host: {{ required "global.host must be set" .Values.global.host | quote }}
        http:
          paths:
            - path: "{{ .Values.ingress.pathPrefix }}(/)((?:capabilities|availability|catalog)/?)$"
              pathType: "ImplementationSpecific"
              backend:
                service:
                  name: "river"
                  port:
                    number: {{ .Values.config.port }}
            - path: "{{ .Values.ingress.pathPrefix }}(/)(dl/.*)"
              pathType: "ImplementationSpecific"
              backend:
                service:
                  name: "river"
                  port:
                    number: {{ .Values.config.port }}
