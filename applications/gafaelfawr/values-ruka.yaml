redis:
  persistence:
    storageClass: "rook-ceph-block"
    k8up:
      enabled: true

config:
  allowSubdomains: true
  slackAlerts: true
  databaseUrl: "postgresql://gafaelfawr@postgresdb01-ruka.lsst.codes/gafaelfawr"
  updateSchema: true

  oidc:
    clientId: "rsp-ruka"
    audience: "rsp-ruka"
    loginUrl: "https://keycloak.ls.lsst.org/realms/master/protocol/openid-connect/auth"
    tokenUrl: "https://keycloak.ls.lsst.org/realms/master/protocol/openid-connect/token"
    issuer: "https://keycloak.ls.lsst.org/realms/master"
    scopes:
      - "openid"
    usernameClaim: "preferred_username"

  ldap:
    url: "ldap://ipa1.ls.lsst.org"
    userDn: "uid=svc_rsp,cn=users,cn=accounts,dc=lsst,dc=cloud"
    userBaseDn: "cn=users,cn=accounts,dc=lsst,dc=cloud"
    uidAttr: "uidNumber"
    gidAttr: "gidNumber"
    groupBaseDn: "cn=groups,cn=accounts,dc=lsst,dc=cloud"

  # Support OpenID Connect clients like Chronograf.
  oidcServer:
    enabled: false

  # Allow access by GitHub team.
  groupMapping:
    "admin:jupyterlab":
      - "k8s-yagan-admins"
      - "sqre"
    "admin:oidc":
      - "k8s-yagan-admins"
      - "sqre"
    "admin:token":
      - "k8s-yagan-admins"
      - "sqre"
    "admin:userinfo":
      - "k8s-yagan-admins"
      - "sqre"
    "exec:admin":
      - "integration-testers"
      - "k8s-yagan-admins"
      - "sqre"
    "exec:internal-tools":
      - "k8s-yagan-admins"
    "exec:notebook":
      - "k8s-yagan-admins"
    "exec:portal":
      - "k8s-yagan-admins"
    "exec:portal-admin":
      - "k8s-yagan-admins"
      - "sqre"
    "read:image":
      - "k8s-yagan-admins"
    "read:sasquatch":
      - "k8s-yagan-admins"
    "read:tap":
      - "k8s-yagan-admins"
    "write:sasquatch":
      - "k8s-yagan-admins"
      - "sqre"
