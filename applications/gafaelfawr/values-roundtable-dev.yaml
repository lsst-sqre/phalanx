config:
  slackAlerts: false

  metrics:
    enabled: true

  sentry:
    enabled: true

  github:
    clientId: "083a615e03ca3dde9392"

  # Support OpenID Connect clients like Chronograf.
  oidcServer:
    enabled: true

  knownScopes:
    "exec:docverse": >-
      Can access Docverse's as a user in an organization
    "exec:internal-tools": >-
      Can use internal APIs
    "exec:linkcheck": >-
      Can submit link-check requests to Ook
    "read:checkerboard": >-
      Can query Checkerboard for user mappings
    "write:intersphinx": >-
      Can read and refresh Ook's cached intersphinx inventories
    "write:git-lfs": >-
      Can write objects to Git LFS storage bucket
    "write:turborepo": >-
      Can read and write to the Turborepo remote cache

  groupMapping:
    "admin:oidc":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "admin:token":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "admin:userinfo":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "exec:admin":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "write:git-lfs":
      - github:
          organization: "lsst-sqre"
          team: "square"
      - github:
          organization: "lsst-sqre"
          team: "friends"
    "read:checkerboard":
      - github:
          organization: "lsst-sqre"
          team: "square"
      - github:
          organization: "lsst-sqre"
          team: "friends"
    "exec:internal-tools":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "exec:linkcheck":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "write:intersphinx":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "write:turborepo":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "exec:docverse":
      - github:
          organization: "lsst-sqre"
          team: "square"

  errorFooter: |
    To report problems or ask for help, contact #square-team on the Rubin
    Observatory Slack.

ingress:
  additionalHosts:
    - "git-lfs-dev.lsst.cloud"
    - "git-lfs-dev-rw.lsst.cloud"

cloudsql:
  enabled: true
  instanceConnectionName: "roundtable-dev-abe2:us-central1:roundtable-dev-572a252e"
  serviceAccount: "gafaelfawr@roundtable-dev-abe2.iam.gserviceaccount.com"

# Use the CSI storage class so that we can use snapshots.
redis:
  persistence:
    storageClass: "standard-rwo"
