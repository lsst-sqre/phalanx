# Use the CSI storage class so that we can use snapshots.
redis:
  persistence:
    storageClass: "standard-rwo"

cloudsql:
  enabled: true
  instanceConnectionName: "roundtable-prod-f6fd:us-central1:roundtable-prod-f119ac3d"
  serviceAccount: "gafaelfawr@roundtable-prod-f6fd.iam.gserviceaccount.com"

config:
  slackAlerts: false
  updateSchema: true

  sentry:
    enabled: true

  github:
    clientId: "8ab507cd4b023d77a216"

  # Support OpenID Connect clients like Chronograf.
  oidcServer:
    enabled: true

  # Enable metrics reporting.
  metrics:
    enabled: true

  knownScopes:
    "exec:docverse": >-
      Can access Docverse's as a user in an organization
    "exec:internal-tools": >-
      Can use internal APIs
    "exec:linkcheck": >-
      Can submit link-check requests to Ook
    "read:checkerboard": >-
      Can query Checkerboard for user mappings
    "write:git-lfs": >-
      Can write objects to Git LFS storage bucket
    "write:intersphinx": >-
      Can read and refresh Ook's cached intersphinx inventories
    "write:turborepo": >-
      Can read and write to the Turborepo remote cache

  groupMapping:
    "admin:oidc":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "admin:token":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "admin:userinfo":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "exec:admin":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "exec:docverse":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "exec:internal-tools":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "exec:linkcheck":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "read:checkerboard":
      - github:
          organization: "lsst-sqre"
          team: "square"
      - github:
          organization: "lsst-sqre"
          team: "friends"
    "write:git-lfs":
      - github:
          organization: "lsst"
          team: "data-management"
      - github:
          organization: "lsst"
          team: "simulations"
      - github:
          organization: "lsst"
          team: "cst"
    "write:intersphinx":
      - github:
          organization: "lsst-sqre"
          team: "square"
    "write:turborepo":
      - github:
          organization: "lsst-sqre"
          team: "square"

  errorFooter: |
    To report problems or ask for help, contact #square-team on the Rubin
    Observatory Slack.

ingress:
  additionalHosts:
    - "git-lfs.lsst.cloud"
    - "git-lfs-rw.lsst.cloud"
