{{- if .Values.pq.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "consdb-pq"
  labels:
    {{- include "consdb.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: "consdb-pq"
  minReplicas: {{ .Values.pq.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.pq.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: "cpu"
        target:
          type: Utilization
          averageUtilization: {{ .Values.pq.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
