# read-only ingress for consdb-pq

apiVersion: gafaelfawr.lsst.io/v1alpha1
kind: GafaelfawrIngress
metadata:
  name: "consdb-pq"
  labels:
    {{- include "consdb.labels" . | nindent 4 }}
config:
  scopes:
    all:
      - "read:tap"
  service: "consdb"
template:
  metadata:
    name: "consdb-pq"
    {{- with .Values.ingress.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  spec:
    rules:
    - host: {{ required "global.host must be set" .Values.global.host | quote }}
      http:
        paths:
        - path: "/consdb"
          pathType: "Prefix"
          backend:
            service:
              name: "consdb-pq"
              port:
                number: 8080
---
# read-write ingress for consdb-pq

apiVersion: gafaelfawr.lsst.io/v1alpha1
kind: GafaelfawrIngress
metadata:
  name: "consdb-pq-write"
  labels:
    {{- include "consdb.labels" . | nindent 4 }}
config:
  scopes:
    all:
      - "write:consdb"
  service: "consdb"
template:
  metadata:
    name: "consdb-pq-write"
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      {{- with .Values.ingress.annotations }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  spec:
    rules:
    - host: {{ required "global.host must be set" .Values.global.host | quote }}
      http:
        paths:
        - path: "/consdb/insert/.*"
          pathType: "ImplementationSpecific"
          backend:
            service:
              name: "consdb-pq"
              port:
                number: 8080
        - path: "/consdb/flex/.+/addkey/?$"
          pathType: "ImplementationSpecific"
          backend:
            service:
              name: "consdb-pq"
              port:
                number: 8080
        - path: "/consdb/flex/.+/update/?$"
          pathType: "ImplementationSpecific"
          backend:
            service:
              name: "consdb-pq"
              port:
                number: 8080
