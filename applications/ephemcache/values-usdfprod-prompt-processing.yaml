image:
  tag: "sha-e94a8746f4e7786e5de7841706fe440b2d1f87e7"

suspend: false

command: "run"

database:
  url: postgresql+psycopg2://mpcorb-db.slac.stanford.edu/mpc_sbn

# uid 18728 has write access to the output directory through an explicit ACL, so
# changing it silently breaks writes.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 48516
  runAsGroup: 4085
  supplementalGroupsPolicy: Strict

logToFile: true

outputDirMount:
  enabled: true
  subPath: "web_data/mpsky-data"

resources:
  requests:
    cpu: "48"
    memory: "64Gi"
  limits:
    cpu: "48"
    memory: "64Gi"

ncores: "48"

activeDeadlineSeconds: 5400

podAnnotations: {
  edu.stanford.slac.sdf.project/usdf-embargo: "true"
}
