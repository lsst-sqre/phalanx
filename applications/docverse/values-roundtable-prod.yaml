image:
  # Temporary: lsst-sqre/docverse#820 (DM-56619 skip tokenless projects in
  # every GitHub ref read; the branch is forked from main after 1.0.0b10 so
  # the image also carries the push hot path). Deployed here to watch the
  # overnight git_ref_audit and keeper-sync crons over the full project set.
  # Drop this override and go back to the chart appVersion once #820 is
  # merged and released.
  tag: "tickets-DM-56619-anonymous-reads"
  pullPolicy: "Always"

config:
  databaseUrl: "postgresql://docverse@localhost/docverse"
  githubAppId: "4990754"
  updateSchema: true
  superadminUsers:
    - "jonathansick"
  keeperSync:
    enabled: true
    pushHotPathEnabled: true
  maintenance:
    enabled: true
    gitRefAuditEnabled: true
  sentry:
    enabled: true
  metrics:
    enabled: true

cloudsql:
  enabled: true
  instanceConnectionName: "roundtable-prod-f6fd:us-central1:roundtable-prod-f119ac3d"
  serviceAccount: "docverse-sa@roundtable-prod-f6fd.iam.gserviceaccount.com"
