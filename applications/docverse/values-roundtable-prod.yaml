image:
  # Temporary: lsst-sqre/docverse#824 (DM-56619 treat an empty GitHub
  # repository's 409 as a clean skip in git_ref_audit, keeper-sync and the
  # resolve worker). The branch is forked from main after docverse#820
  # merged, so the image also carries the tokenless-project skip and the
  # push hot path. Deployed here to watch the overnight git_ref_audit and
  # keeper-sync crons over the full project set. Drop this override and go
  # back to the chart appVersion once #824 is merged and released.
  tag: "tickets-DM-56619-empty-repos"
  pullPolicy: "Always"

config:
  databaseUrl: "postgresql://docverse@localhost/docverse"
  githubAppId: "4990754"
  updateSchema: true
  superadminUsers:
    - "jonathansick"
  keeperSync:
    enabled: true
    pushHotPathEnabled: true
  maintenance:
    enabled: true
    gitRefAuditEnabled: true
  sentry:
    enabled: true
  metrics:
    enabled: true

cloudsql:
  enabled: true
  instanceConnectionName: "roundtable-prod-f6fd:us-central1:roundtable-prod-f119ac3d"
  serviceAccount: "docverse-sa@roundtable-prod-f6fd.iam.gserviceaccount.com"
