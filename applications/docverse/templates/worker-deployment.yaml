apiVersion: apps/v1
kind: Deployment
metadata:
  name: "docverse-worker"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "docverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: "worker"
    docverse-redis-client: "true"
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      {{- include "docverse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: "worker"
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "docverse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: "worker"
        docverse-redis-client: "true"
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.cloudsql.enabled }}
      serviceAccountName: "docverse"
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      containers:
        - name: "docverse-worker"
          command: ["arq"]
          args: ["{{ .Values.image.pythonModule }}.worker.main.WorkerSettings"]
          env:
            {{- include "docverse.envVars" . | nindent 12 }}
            {{- include "docverse.kafkaEnvVars" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: "docverse"
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.workerResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "all"
            readOnlyRootFilesystem: true
          volumeMounts:
            # build_processing spools each staging tarball to a temporary
            # file under /tmp while it unpacks it; the root filesystem is
            # read-only, so /tmp has to be a writable, disk-backed volume.
            - name: "tmp"
              mountPath: "/tmp"
            {{- if .Values.config.metrics.enabled }}
            {{- include "docverse.kafkaVolumeMounts" . | nindent 12 }}
            {{- end }}
      {{- if .Values.cloudsql.enabled }}
      initContainers:
        {{- include "docverse.cloudsqlSidecar" . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        # Disk-backed on purpose: a `medium: Memory` emptyDir is a tmpfs
        # whose contents count against the memory limit, which would put
        # the whole tarball back in memory.
        - name: "tmp"
          emptyDir:
            sizeLimit: {{ .Values.workerTmpSizeLimit | quote }}
        {{- if .Values.config.metrics.enabled }}
        {{- include "docverse.kafkaVolume" . | nindent 8 }}
        {{- end }}
