image:
  # Temporary override for dev run 2 of lsst-sqre/docverse#753 (proving
  # the fix for the sync-worker memory growth from lsst-sqre/docverse#751):
  # the tickets/DM-56095-shared-botocore-session branch (PR #763, stacked
  # on #762) carries the memory sampler plus the shared aiobotocore
  # session. Revert to the chart appVersion once the server release
  # carrying that work ships.
  tag: "tickets-DM-56095-shared-botocore-session"
  pullPolicy: "Always"

config:
  logLevel: "DEBUG"
  databaseUrl: "postgresql://docverse@localhost/docverse"
  githubAppId: "3556766"
  updateSchema: true
  superadminUsers:
    - "jonathansick"
  keeperSync:
    enabled: true
  maintenance:
    enabled: true
    gitRefAuditEnabled: true
  sentry:
    enabled: true
  metrics:
    enabled: true
  memoryDiagnostics:
    # Both on for the lsst-sqre/docverse#753 dev investigation; turn
    # tracemalloc back off once the runs are recorded.
    enabled: true
    tracemallocEnabled: true

cloudsql:
  enabled: true
  instanceConnectionName: "roundtable-dev-abe2:us-central1:roundtable-dev-572a252e"
  serviceAccount: "docverse-sa@roundtable-dev-abe2.iam.gserviceaccount.com"
