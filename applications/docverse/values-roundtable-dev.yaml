image:
  # Branch image from lsst-sqre/docverse#838 (DM-56771: revive
  # lifecycle-deleted editions) for dev validation. Remove once the
  # change ships in a release and appVersion is bumped.
  tag: "tickets-DM-56771-lifecycle-revive"
  pullPolicy: "Always"

config:
  logLevel: "DEBUG"
  databaseUrl: "postgresql://docverse@localhost/docverse"
  githubAppId: "3556766"
  updateSchema: true
  superadminUsers:
    - "jonathansick"
  keeperSync:
    enabled: true
    pushHotPathEnabled: true
  maintenance:
    enabled: true
    gitRefAuditEnabled: true
  sentry:
    enabled: true
  metrics:
    enabled: true
  memoryDiagnostics:
    # Sampler stays on; tracemalloc was only for the lsst-sqre/docverse#753
    # dev runs, all recorded on lsst-sqre/docverse#751.
    enabled: true

cloudsql:
  enabled: true
  instanceConnectionName: "roundtable-dev-abe2:us-central1:roundtable-dev-572a252e"
  serviceAccount: "docverse-sa@roundtable-dev-abe2.iam.gserviceaccount.com"
