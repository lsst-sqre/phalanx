config:
  logLevel: "DEBUG"
  databaseUrl: "postgresql://docverse@localhost/docverse"
  githubAppId: "3556766"
  updateSchema: true
  superadminUsers:
    - "jonathansick"
  keeperSync:
    enabled: true
    pushHotPathEnabled: true
  maintenance:
    enabled: true
    gitRefAuditEnabled: true
  buildProcessing:
    # Raised for the DM-56964 pipelines weekly/daily upload measurement
    # (lsst-sqre/docverse#864 §7); the prod value is sized from that test.
    jobTimeoutSeconds: 3600
  sentry:
    enabled: true
  metrics:
    enabled: true
  memoryDiagnostics:
    # Sampler stays on; tracemalloc was only for the lsst-sqre/docverse#753
    # dev runs, all recorded on lsst-sqre/docverse#751.
    enabled: true

cloudsql:
  enabled: true
  instanceConnectionName: "roundtable-dev-abe2:us-central1:roundtable-dev-572a252e"
  serviceAccount: "docverse-sa@roundtable-dev-abe2.iam.gserviceaccount.com"

image:
  # Branch image for lsst-sqre/docverse#875 (DM-56964 build_processing
  # timeout); drop once the server release carrying it is in Chart.yaml.
  tag: "tickets-DM-56964-build-timeout"
  pullPolicy: "Always"
