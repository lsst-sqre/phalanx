image:
  # Temporary: lsst-sqre/docverse#811 (DM-56619 keeper-sync push hot path;
  # the branch is rebased on main so it also carries the merged #812 GitHub
  # id resolution). Drop this override and go back to the chart appVersion
  # once #811 is merged and released.
  tag: "tickets-DM-56619-push-hot-path"
  pullPolicy: "Always"

config:
  logLevel: "DEBUG"
  databaseUrl: "postgresql://docverse@localhost/docverse"
  githubAppId: "3556766"
  updateSchema: true
  superadminUsers:
    - "jonathansick"
  keeperSync:
    enabled: true
  maintenance:
    enabled: true
    gitRefAuditEnabled: true
  sentry:
    enabled: true
  metrics:
    enabled: true
  memoryDiagnostics:
    # Sampler stays on; tracemalloc was only for the lsst-sqre/docverse#753
    # dev runs, all recorded on lsst-sqre/docverse#751.
    enabled: true

cloudsql:
  enabled: true
  instanceConnectionName: "roundtable-dev-abe2:us-central1:roundtable-dev-572a252e"
  serviceAccount: "docverse-sa@roundtable-dev-abe2.iam.gserviceaccount.com"
