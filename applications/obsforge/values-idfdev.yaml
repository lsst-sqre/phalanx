image:
  pullPolicy: "Always"
  tag: tickets-DM-55184

config:
  databaseUrl: "postgresql://obsforge@obsforge-db-dev.slac.stanford.edu:5432/obsdb"
  updateSchema: true
  butlerRepository: "https://data-int.lsst.cloud/api/butler/repo/prompt/butler.yaml"
  kafkaBrokerAddress: "sasquatch-usdf-kafka-bootstrap.lsst.cloud:9094"
  kafkaUsername: "obsforge"
  obscoreConfig: "https://raw.githubusercontent.com/lsst-dm/dax_obscore/refs/heads/main/configs/prompt.yaml"
  schemaRegistryUrl: "https://usdf-rsp.slac.stanford.edu/schema-registry"
  logLevel: "DEBUG"
  logProfile: "development"

streamWorkers:
  enabled: true
  pipelines:
    scheduler-observatory-state:
      affinity: {}
      configPath: "/app/config/streams/scheduler-observatory-state.yaml"
      nodeSelector: {}
      podAnnotations: {}
      replicaCount: 1
      resources:
        limits:
          cpu: "1"
          memory: "1Gi"
        requests:
          cpu: "100m"
          memory: "256Mi"
      tolerations: []
