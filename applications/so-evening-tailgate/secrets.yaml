slack-webhook:
  description: >-
    Slack web hook used to report internal errors to Slack. This secret may be
    changed at any time.
  if: config.slackAlerts
  copy:
    application: mobu
    key: app-alert-webhook
bot_token:
  description: "Bot token for the evening tailgate app."
app_token:
  description: "App token for the evening tailgate app."
