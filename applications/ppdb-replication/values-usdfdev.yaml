image:

  tag: main

config:

  # -- Logging profile (`production` for JSON, `development` for
  # human-friendly)
  logProfile: "development"

  # -- APDB config file resource
  apdbConfig: "/sdf/data/rubin/user/jeremym/ppdb-config/apdb_dev.yaml"

  # -- CloudSQL Python Connector configuration
  cloudSql:

    # -- CloudSQL Connection Name
    connectionName: "ppdb-dev-5c07:us-central1:ppdb-dev"

    # -- Username in sa_name@project.iam format
    user: "usdf-replication@ppdb-dev-5c07.iam"

    # -- Database name to connect to
    dbName: "ppdb-chunk-tracking"

  # -- PPDB config file resource
  ppdbConfig: "gs://ppdb-dev-config/ppdb-dev-5c07_config.yaml"

  # -- Time to wait before checking for new chunks, if no chunk appears
  checkInterval: 60

  # -- Time to wait between uploader file scans
  waitInterval: 60

  # -- Volumes specific to the environment
  volumes:
    - name: sdf-group-rubin
      persistentVolumeClaim:
        claimName: sdf-group-rubin
    - name: sdf-data-rubin
      persistentVolumeClaim:
        claimName: sdf-data-rubin
    - name: sdf-scratch
      persistentVolumeClaim:
        claimName: sdf-scratch
  # -- Volume mounts
  volumeMounts:
    - name: sdf-group-rubin
      mountPath: /sdf/group/rubin
    - name: sdf-data-rubin
      mountPath: /sdf/data/rubin
    - name: sdf-scratch
      mountPath: /sdf/scratch
  # -- Persistent volume claims
  persistentVolumeClaims:
    - name: sdf-group-rubin
      storageClassName: sdf-group-rubin
    - name: sdf-data-rubin
      storageClassName: sdf-data-rubin
    - name: sdf-scratch
      storageClassName: sdf-scratch
