apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: integration-test-job-template
spec:
  serviceAccountName: {{ .Values.serviceAccount }}
  artifactRepositoryRef:
    configMap: integration-test-controller-configmap
    key: artifactRepository
  entrypoint: inttest-template
  ttlStrategy:
    secondsAfterCompletion: 1800
  imagePullSecrets:
  - name: pull-secret
  volumes:
  - name: testreports
    persistentVolumeClaim:
      claimName: {{ .Values.persistentVolume.claimName }}
  {{- if .Values.efdCredentials }}
  - name: efd-credentials-raw
    secret:
      secretName: control-system-test
      items:
      - key: {{ .Values.efdCredentials.secretFilename }}
        path: {{ .Values.efdCredentials.secretFilename }}
      defaultMode: 0440
  - name: efd-credentials
    emptyDir: {}
  {{- end }}
  templates:
  - name: inttest-template
    inputs:
      parameters:
      - name: integrationtest
        value: "-A Run-Robot.list"
      - name: jobname
        value: "myjob"
      - name: reportname
        value: "report.xml"
    outputs:
      artifacts:
      - name: integration-test-reports
        archive:
          none: {}
        path: {{ .Values.reportLocation }}/{{ printf "{{inputs.parameters.reportname}}" }}
        s3:
          key: IntegrationTests/{{ printf "{{workflow.parameters.date-key}}" }}/{{ printf "{{inputs.parameters.reportname}}" }}
    metadata:
      labels:
        argocd.argoproj.io/instance: {{ .Values.jobLabelName }}
    securityContext:
      runAsUser: 73006
      runAsGroup: 73006
      fsGroup: 73006
    {{- if .Values.efdCredentials }}
    initContainers:
    - name: efd-credentials-fixer
      image: "alpine:latest"
      command:
      - "/bin/ash"
      - "-c"
      - |
        cp /secrets-raw/{{ .Values.efdCredentials.secretFilename }} /secrets/
        chmod 0600 /secrets/{{ .Values.efdCredentials.secretFilename }}
      volumeMounts:
      - name: efd-credentials-raw
        mountPath: /secrets-raw
        readOnly: true
      - name: efd-credentials
        mountPath: /secrets
    {{- end }}
    container:
      command: [/home/saluser/.startup.sh]
      name: test-{{ printf "{{inputs.parameters.jobname}}" }}
      {{- $imageTag := .Values.image.tag | default $.Values.global.controlSystem.imageTag }}
      image: "ts-dockerhub.lsst.org/integrationtests:{{ $imageTag }}"
      imagePullPolicy: Always
      envFrom:
      - configMapRef:
          name: csc-env-config
      env:
      - name: ENV_EFD
        value: {{ .Values.envEfd }}
      - name: RUN_ARG
        value: {{ printf "'{{inputs.parameters.integrationtest}}'" }}
      - name: LSST_KAFKA_SECURITY_PASSWORD
        valueFrom:
          secretKeyRef:
            name: control-system-test
            key: ts-salkafka-password
      {{- if .Values.efdCredentials }}
      - name: EFDAUTH
        value: "{{ .Values.efdCredentials.containerPath }}/{{ .Values.efdCredentials.secretFilename }}"
      {{- end }}
      resources:
        limits:
          cpu: 4
          memory: 4Gi
        requests:
          cpu: 1
          memory: 1Gi
      volumeMounts:
      - name: testreports
        mountPath: {{ .Values.reportLocation }}
        readOnly: false
      {{- if .Values.efdCredentials }}
      - name: efd-credentials
        mountPath: {{ .Values.efdCredentials.containerPath }}/{{ .Values.efdCredentials.secretFilename }}
        subPath: {{ .Values.efdCredentials.secretFilename }}
        readOnly: true
      {{- end }}
