apiVersion: opensearch.org/v1
kind: OpenSearchCluster
metadata:
  name: {{ .Values.clusterName }}
spec:
  general:
    pluginsList:  {{ .Values.pluginsList}}
    serviceName: {{ .Values.clusterName }}
    setVMMaxMapCount: true
    version: {{ .Values.version }}
    {{- if .Values.s3.enabled }}
    keystore:
      - secret:
          name: {{ .Values.clusterName }}
        keyMappings:
          s3-access-key: s3.client.default.access_key
          s3-secret-key: s3.client.default.secret_key
    {{- end }}
  dashboards:
    enable: {{ .Values.dashboards.enable }}
    version: {{ .Values.version }}
    additionalConfig:
      server.basePath: "/opensearch-admin"
  nodePools:
    - component: masters
      replicas: {{ .Values.nodePools.masters.replicaCount }}
      diskSize: {{ .Values.nodePools.masters.diskSize }}
      resources:
        {{- toYaml .Values.nodePools.masters.resources | nindent 8 }}
      jvm: {{ .Values.nodePools.masters.jvm }}
      roles:
        - "cluster_manager"
      affinity:
        {{- toYaml .Values.nodePools.masters.affinity | nindent 8 }}
    - component: data
      replicas: {{ .Values.nodePools.data.replicaCount }}
      diskSize: {{ .Values.nodePools.data.diskSize }}
      resources:
        {{- toYaml .Values.nodePools.data.resources | nindent 8 }}
      jvm: {{ .Values.nodePools.data.jvm }}
      roles:
        - "data"
      affinity:
        {{- toYaml .Values.nodePools.data.affinity | nindent 8 }}
  security:
    tls:
      http:
        enabled: {{ .Values.security.tls.http.enabled }}
        generate: {{ .Values.security.tls.http.generateEnabled }}
        duration: {{ .Values.security.tls.http.certificateDuration }}
        rotateDaysBeforeExpiry: {{ .Values.security.tls.http.rotateDaysBeforeExpiry }}
      transport:
        enabled: {{ .Values.security.tls.transport.enabled }}
        generate: {{ .Values.security.tls.transport.generateEnabled }}
        perNode: {{ .Values.security.tls.transport.perNodeEnabled }}
        duration: {{ .Values.security.tls.transport.certificateDuration }}
        rotateDaysBeforeExpiry: {{ .Values.security.tls.transport.rotateDaysBeforeExpiry }}
