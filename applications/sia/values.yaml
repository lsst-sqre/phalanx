# Default values for sia.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of web deployment pods to start
replicaCount: 1

image:
  # -- Image to use in the sia deployment
  repository: "ghcr.io/lsst-sqre/sia"

  # -- Pull policy for the sia image
  pullPolicy: "IfNotPresent"

  # -- Tag of image to use
  # @default -- The appVersion of the chart
  tag: ""

config:
  # -- List of datasets enabled in this environment.
  datasets:
    - "dp02"
    - "dp1"

  # -- Format string for the IVOID used for self-identification. This must
  # contain a `dataset` variable that will be replaced with the label of the
  # dataset.
  ivoidFormat: "ivo://org.rubinobs/{dataset}/sia"

  metrics:
    # -- Whether to enable sending metrics
    enabled: false

    # -- Name under which to log metrics. Generally there is no reason to
    # change this.
    application: "sia"

    events:
      # -- Topic prefix for events. It may sometimes be useful to change this
      # in development environments.
      topicPrefix: "lsst.square.metrics.events"

    schemaManager:
      # -- URL of the Confluent-compatible schema registry server
      # @default -- Sasquatch in the local cluster
      registryUrl: "http://sasquatch-schema-registry.sasquatch.svc.cluster.local:8081"

      # -- Suffix to add to all registered subjects. This is sometimes useful
      # for experimentation during development.
      suffix: ""

  # -- Logging level
  logLevel: "INFO"

  # -- Logging profile (`production` for JSON, `development` for
  # human-friendly)
  logProfile: "production"

  # -- ObsCore exporter configurations by dataset
  # @default -- See `values.yaml`
  obscoreConfig:
    dp02: "https://raw.githubusercontent.com/lsst-dm/dax_obscore/refs/heads/main/configs/dp02.yaml"
    dp1: "https://raw.githubusercontent.com/lsst-dm/dax_obscore/refs/heads/main/configs/dp1.yaml"
    dp2: "https://raw.githubusercontent.com/lsst-dm/dax_obscore/refs/heads/main/configs/edp2.yaml"
    prompt: "https://raw.githubusercontent.com/lsst-dm/dax_obscore/refs/heads/main/configs/prompt.yaml"

  # -- URL path prefix
  pathPrefix: "/api/sia"

  sentry:
    # -- Set to true to enable the Sentry integration.
    enabled: false

    # -- The percentage of requests that should be traced. This should be a
    # float between 0 and 1.
    tracesSampleRate: 0.0

  # -- Whether to send alerts and status to Slack.
  slackAlerts: false

ingress:
  # -- Additional annotations for the ingress rule
  annotations: {}

# -- Affinity rules for the sia deployment pod
affinity: {}

# -- Node selection rules for the sia deployment pod
nodeSelector: {}

# -- Annotations for the sia deployment pod
podAnnotations: {}

# -- Resource limits and requests for the sia deployment pod
# @default -- See `values.yaml`
resources:
  requests:
    cpu: 2.0
    memory: "2Gi"
  limits:
    cpu: 8.0
    memory: "32Gi"

# -- Tolerations for the sia deployment pod
# @default -- Tolerate GKE amd64 and arm64 taints
tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "amd64"
    effect: "NoSchedule"
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"

# The following will be set by parameters injected by Argo CD and should not
# be set in the individual environment values files.
global:
  # -- Name of the Phalanx environment
  # @default -- Set by Argo CD Application
  environmentName: null

  # -- Host name for ingress
  # @default -- Set by Argo CD
  host: null

  # -- Base path for Vault secrets
  # @default -- Set by Argo CD
  vaultSecretsPath: null
