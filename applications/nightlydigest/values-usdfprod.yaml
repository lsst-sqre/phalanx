nightlydigest-nginx:
  image:
    repository: nginx
    tag: 1.31.3
    pullPolicy: Always
  ingress:
    httpPath: /nightlydigest
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
  initContainers:
    frontend:
      image:
        repository: ts-dockerhub.lsst.org/nightlydigest-frontend
        tag: c0045.000
        pullPolicy: Always
  staticStore:
    name: nightlydigest-nginx-static
    storageClass: sdf-data-rubin
    accessMode: ReadWriteMany
    claimSize: 1Gi
    subPath: nightlydigest-prod
  resources:
    requests:
      cpu: 50m
      memory: 70Mi
    limits:
      cpu: 500m
      memory: 300Mi
  nginxConfig: |
    proxy_cache_path /var/cache/nginx/nightlydigest
      levels=1:2
      keys_zone=nightlydigest_cache:10m
      max_size=1g
      inactive=1d
      use_temp_path=off;

    log_format cache_log '$remote_addr - $remote_user [$time_local] '
      '"$request" $status $body_bytes_sent '
      '"$http_referer" "$http_user_agent" '
      'cache=$upstream_cache_status';

    server {
      listen 80;
      server_name localhost;
      access_log /var/log/nginx/access.log cache_log;

      location /nightlydigest {
        root /usr/src;
        try_files $uri$args $uri$args/ $uri/ /nightlydigest/index.html;
      }

      location /nightlydigest/api/ {
        proxy_pass http://nightlydigest-backend-service:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_pass_header Cache-Control;

        proxy_cache nightlydigest_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;

        proxy_redirect off;

        add_header X-Cache-Status $upstream_cache_status;
      }
    }

nightlydigest-backend:
  replicas: 4
  image:
    repository: ts-dockerhub.lsst.org/nightlydigest-backend
    tag: c0045.000
    pullPolicy: Always
  env:
    - name: JIRA_API_HOSTNAME
      value: rubinobs.atlassian.net
    - name: EXTERNAL_INSTANCE_URL
      value: https://usdf-rsp.slac.stanford.edu
    - name: RUBIN_SIM_DATA_DIR
      value: &rsd /sdf/data/rubin/shared/rubin_sim_data
    - name: AWS_SHARED_CREDENTIALS_FILE
      value: /etc/secrets/aws-credentials-rubin-scheduler-prenight.ini
    - name: S3_ENDPOINT_URL
      value: https://s3dfrgw.slac.stanford.edu
    - name: LSST_DISABLE_BUCKET_VALIDATION
      value: "1"
  envSecrets:
    - name: JIRA_API_TOKEN
      secretName: nightlydigest
      secretKey: jira-api-token
    - name: ZEPHYR_API_TOKEN
      secretName: nightlydigest
      secretKey: zephyr-api-token
    - name: ACCESS_TOKEN
      secretName: nightlydigest-backend-gafaelfawr-token
      secretKey: token
  pvcMountpoints:
    - name: sdf-data-rubin
      storageClassName: sdf-data-rubin
      accessMode: ReadOnlyMany
      capacity: 1Gi
      mount:
        readOnly: true
        subPath: shared/rubin_sim_data
        mountPath: *rsd
  resources:
    requests:
      cpu: 150m
      memory: 3Gi
    limits:
      cpu: 1000m
      memory: 10Gi
