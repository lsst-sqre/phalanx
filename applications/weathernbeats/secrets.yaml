.efdauth.json:
  description: >-
    Credentials for EFD access.
  copy:
    application: obssys
    key: .efdauth.json

slack-webhook:
  description: >-
    Slack web hook used to report internal errors to Slack. This secret may be
    changed at any time.
  if: config.slackAlerts
  copy:
    application: mobu
    key: app-alert-webhook
