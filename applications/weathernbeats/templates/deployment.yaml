apiVersion: apps/v1
kind: Deployment
metadata:
  name: "weathernbeats"
  labels:
    {{- include "weathernbeats.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "weathernbeats.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "weathernbeats.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: {{ .Chart.Name }}
          env:
            {{- if .Values.efdCredentials }}
            - name: "EFDAUTH"
              value: {{ printf "%s/%s" .Values.efdCredentials.containerPath .Values.efdCredentials.secretFilename | quote }}
            {{- end }}
            {{- if .Values.config.slackAlerts }}
            - name: "WEATHERNBEATS_SLACK_WEBHOOK"
              valueFrom:
                secretKeyRef:
                  name: "weathernbeats"
                  key: "slack-webhook"
            {{- end }}
            # Uvicorn keepalive timeout, in seconds. This should be longer
            # than any keepalive timeouts on any downstream proxies. The
            # keepalive timeout for ingress-nginx connections is 60s.
            - name: "UVICORN_TIMEOUT_KEEP_ALIVE"
              value: "61"
          envFrom:
            - configMapRef:
                name: "weathernbeats"
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          lifecycle:
            # Number of seconds k8s should wait before sending SIGTERM on
            # graceful restarts/deployments/shutdowns. We need this because it
            # takes ingress-nginx some time to configure itself to stop
            # sending traffic to the pods scheduled for termination. If
            # Uvicorn gets the SIGTERM and starts closing connections, we
            # could end up with a TCP race condition if ingress-nginx still
            # tries to send data over those connections.
            #
            # Note that terminationGracePeriodSeconds includes the time that
            # is spent in the preStop hook. If you’re adding a preStop hook
            # and your terminationGracePeriodSeconds is super fine-tuned, then
            # you should update your terminationGracePeriodSeconds to add the
            # amount of time you’ll be spending in your preStop hook.
            preStop:
              sleep:
                seconds: 10
          ports:
            - name: "http"
              containerPort: 8080
              protocol: "TCP"
          readinessProbe:
            httpGet:
              path: "/"
              port: "http"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "all"
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: "tmp"
              mountPath: "/tmp"
            {{- if .Values.efdCredentials }}
            - name: "efd-credentials"
              mountPath: {{ .Values.efdCredentials.containerPath | quote }}
              readOnly: true
            {{- end }}
      {{- if .Values.efdCredentials }}
      initContainers:
        # EFD authentication requires a credential file owned by the app user.
        - name: "fix-efd-credentials-permissions"
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "python"
            - "-c"
            - |
              import os
              import shutil
              import sys
              shutil.copyfile(sys.argv[1], sys.argv[2])
              os.chmod(sys.argv[2], 0o600)
            - {{ printf "/secrets-raw/%s" .Values.efdCredentials.secretFilename | quote }}
            - {{ printf "/secrets/%s" .Values.efdCredentials.secretFilename | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "all"
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: "efd-credentials-raw"
              mountPath: "/secrets-raw"
              readOnly: true
            - name: "efd-credentials"
              mountPath: "/secrets"
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        {{- if .Values.efdCredentials }}
        - name: "efd-credentials-raw"
          secret:
            secretName: "weathernbeats"
            defaultMode: 0440
            items:
              - key: {{ .Values.efdCredentials.secretFilename | quote }}
                path: {{ .Values.efdCredentials.secretFilename | quote }}
        - name: "efd-credentials"
          emptyDir:
            medium: "Memory"
        {{- end }}
        - name: "tmp"
          emptyDir:
            medium: "Memory"
            sizeLimit: "64Mi"
