# Branch build of ook PR #392 (tickets/DM-55388) for testing on
# roundtable-dev. Revert to the chart's appVersion once ook releases.
image:
  tag: "tickets-DM-55388"
  pullPolicy: "Always"

config:
  logLevel: "DEBUG"
  databaseUrl: "postgresql://ook@localhost/ook"
  algolia:
    documentIndex: "ook_documents_test"
  updateSchema: true
  migrateCountryCodes: true

audit:
  enabled: false
  schedule: "30 1 * * *"
  reingest: false

ingestUpdated:
  enabled: false

linkcheckRecheck:
  enabled: true
  schedule: "45 4 * * *"

intersphinxRefresh:
  enabled: true
  schedule: "15 * * * *"

intersphinxIngest:
  enabled: true
  schedule: "30 5 * * *"

ingestLsstTexmf:
  enabled: true

cloudsql:
  enabled: true
  instanceConnectionName: "roundtable-dev-abe2:us-central1:roundtable-dev-572a252e"
  serviceAccount: "ook-sa@roundtable-dev-abe2.iam.gserviceaccount.com"
