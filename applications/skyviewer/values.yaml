# Default values for skyviewer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of web deployment pods to start
replicaCount: 1

image:
  # -- Image to use in the skyviewer deployment
  repository: "ghcr.io/lsst-dm/skyviewer-client"

  # -- Pull policy for the skyviewer image
  pullPolicy: "IfNotPresent"

  # -- Tag of image to use
  # @default -- The appVersion of the chart
  tag: null

# -- Image pull secrets. Needed only while the GHCR package is private; a
# public package pulls without credentials.
# @default -- See `values.yaml`
imagePullSecrets: []
# Each entry is of the form: { name: pull-secret-name }

ingress:
  # -- Additional annotations for the ingress rule
  annotations: {}

  # -- Path the app is served under. Must match the NEXT_PUBLIC_BASE_PATH the
  # image was built with: Next.js compiles its base path into the client
  # bundle, so the two cannot be changed independently.
  path: "/skyviewer"

config:
  # -- Directory holding the HiPS surveys. Must sit below `hipsData.mountPath`.
  hipsDataDir: "/sdf/group/rubin/shared/hips_views"

  # -- Path below `hipsDataDir` of the single survey to display, e.g.
  # `LSSTCam/hips/ltl2/color_gri`. The CMS advertises public datasets absent
  # from this tree, so without this the viewer offers surveys whose every tile
  # 404s.
  hipsSurvey: ""

  # -- Craft CMS GraphQL API, used for page content and tours. Imagery comes
  # from `hipsSurvey`, not from here.
  apiUrl: "https://api.skyviewer.app/api"

  # -- Astro objects API, used by the search panel.
  astroApiUrl: "https://us-central1-edc-prod-eef0.cloudfunctions.net/astro-objects-api"

  # -- PROD, INT or DEV. DEV additionally enables the GCS proxy route and the
  # debug UI.
  cloudEnv: "PROD"

# -- Volumes holding the HiPS surveys, mounted read-only. More than one is
# usually needed: /sdf/group/rubin/shared is a symlink to
# /sdf/data/rubin/shared, so mounting only the group export leaves the
# surveys unreachable through a dangling symlink.
# @default -- See `values.yaml`
hipsData:
  # -- Whether to mount the HiPS volumes. Without them the viewer has no
  # imagery.
  enabled: true

  # -- Supplemental group IDs the pod runs with. The data exports are
  # group-readable only (/sdf/data/rubin/shared is drwxr-s---, group 4085),
  # so without the right group every read is denied even with the volumes
  # mounted.
  supplementalGroups:
    - 4085

  # -- Claims to create and mount. Each entry needs `name`,
  # `storageClassName`, `capacity` and `mountPath`. `config.hipsDataDir` must
  # resolve below one of them, following symlinks.
  mounts:
    - name: "sdf-group-rubin"
      storageClassName: "sdf-group-rubin"
      # the claim binds an existing export, so this is nominal rather than an
      # allocation
      capacity: "1Gi"
      mountPath: "/sdf/group/rubin"
    - name: "sdf-data-rubin"
      storageClassName: "sdf-data-rubin"
      capacity: "1Gi"
      mountPath: "/sdf/data/rubin"

# -- Affinity rules for the skyviewer deployment pod
affinity: {}

# -- Node selection rules for the skyviewer deployment pod
nodeSelector: {}

# -- Annotations for the skyviewer deployment pod
podAnnotations: {}

# -- Resource limits and requests for the skyviewer deployment pod
# @default -- See `values.yaml`
resources:
  requests:
    cpu: 0.5
    memory: "1Gi"
  limits:
    # tiles are served through the pod rather than straight from a CDN, so it
    # carries all tile traffic for every viewer
    cpu: 2
    memory: "4Gi"

# -- Tolerations for the skyviewer deployment pod
tolerations: []

# The following will be set by parameters injected by Argo CD and should not
# be set in the individual environment values files.
global:
  # -- Host name for ingress
  # @default -- Set by Argo CD
  host: null

  # -- Base path for Vault secrets
  # @default -- Set by Argo CD
  vaultSecretsPath: null
