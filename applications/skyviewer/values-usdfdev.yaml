config:
  # a private processing staged under /sdf/group/rubin/shared/hips_views;
  # the CMS has no entry for it, so it is named explicitly here
  hipsSurvey: "LSSTCam/hips/ltl2/color_gri"

image:
  pullPolicy: "Always"
  tag: "tickets-DM-55722"

# both exports are needed: /sdf/group/rubin/shared is a symlink to
# /sdf/data/rubin/shared, so the group mount alone leaves the surveys behind
# a dangling symlink and the viewer finds no imagery
hipsData:
  enabled: true
  mounts:
    - name: "sdf-group-rubin"
      storageClassName: "sdf-group-rubin"
      capacity: "1Gi"
      mountPath: "/sdf/group/rubin"
    - name: "sdf-data-rubin"
      storageClassName: "sdf-data-rubin"
      capacity: "1Gi"
      mountPath: "/sdf/data/rubin"
