"craft-secret-token":
  description: >-
    Token for the Craft CMS API. The CMS this deployment reads answers
    unauthenticated queries, and the value is only required because the
    application validates its whole environment when the server boots, so a
    generated value is sufficient.
  generate:
    type: password
"craft-revalidate-secret-token":
  description: >-
    Token gating the CMS preview and revalidate routes. This deployment does
    not use CMS preview, so the value only has to be present, but generating
    it rather than fixing it keeps those routes closed.
  generate:
    type: password
"astro-objects-api-token":
  description: >-
    Token for the astro objects API used by the search panel. The value the
    browser actually sends is compiled into the client bundle when the image
    is built, because it is a NEXT_PUBLIC_ variable; this copy exists only to
    satisfy the boot-time environment check, so it need not match.
  generate:
    type: password
