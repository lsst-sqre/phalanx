"craft-secret-token":
  description: >-
    Token for the Craft CMS API. The CMS this deployment reads answers
    unauthenticated queries, and the value is only required because the
    application validates its whole environment when the server boots, so a
    generated value is sufficient.
  generate:
    type: password
"craft-revalidate-secret-token":
  description: >-
    Token for the application's /api/preview and /api/revalidate routes,
    which compare a token supplied by the caller against this value and
    reject the request if it does not match. Those routes exist for CMS
    editors previewing unpublished content, which this deployment does not
    do, so the value is generated: nobody knows it, so nobody can invoke
    them.
  generate:
    type: password
"astro-objects-api-token":
  description: >-
    Token for the astro objects API used by the search panel. Only the
    browser calls that API, using the value compiled into its bundle when
    the image was built -- NEXT_PUBLIC_ variables are substituted at build
    time, not read at runtime. The server nevertheless refuses to start
    unless the variable is set, because it validates its entire environment,
    client variables included, on boot. So a value is required here but is
    never sent anywhere, and generating one avoids storing a copy of the
    real token that could drift from the one in the image.
  generate:
    type: password
