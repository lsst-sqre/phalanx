{{- include "cadc-tap.validateBackend" . }}
{{- include "cadc-tap.validateDatabaseType" .Values.tapSchema.type }}
{{- include "cadc-tap.validateDatabaseType" .Values.uws.type }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "cadc-tap.fullname" . }}
  labels:
    {{- include "cadc-tap.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cadc-tap.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: "server"
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cadc-tap.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: "server"
    spec:
      {{- if or .Values.cloudsql.enabled (eq .Values.tapSchema.type "cloudsql") (eq .Values.uws.type "cloudsql") }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
        - name: "init-tomcat-dirs"
          {{- if eq .Values.config.backend "pg" }}
          image: "{{ .Values.config.pg.image.repository }}:{{ .Values.config.pg.image.tag }}"
          imagePullPolicy: {{ .Values.config.pg.image.pullPolicy | quote }}
          {{- else if eq .Values.config.backend "bigquery" }}
          image: "{{ .Values.config.bigquery.image.repository }}:{{ .Values.config.bigquery.image.tag }}"
          imagePullPolicy: {{ .Values.config.bigquery.image.pullPolicy | quote }}
          {{- else }}
          image: "{{ .Values.config.qserv.image.repository }}:{{ .Values.config.qserv.image.tag }}"
          imagePullPolicy: {{ .Values.config.qserv.image.pullPolicy | quote }}
          {{- end }}
          command:
            - "/bin/bash"
            - "-c"
            - |
              set -e
              mkdir -p /var/lib/tomcat/webapps /var/lib/tomcat/conf
              mkdir -p /var/cache/tomcat/temp
              cp -r /etc/tomcat/* /var/lib/tomcat/conf/

              # Extract WAR
              cd /var/lib/tomcat/webapps
              for war in /opt/tomcat-wars/*.war; do
                warname=$(basename "$war" .war)
                mkdir -p "$warname"
                cd "$warname"
                unzip -q "$war"
                cd ..
              done

              # Select the PluginFactory for the configured backend
              for dir in /var/lib/tomcat/webapps/*/; do
                src="${dir}WEB-INF/classes/PluginFactory-{{ .Values.config.backend }}.properties"
                if [ -f "$src" ]; then
                  cp "$src" "${dir}WEB-INF/classes/PluginFactory.properties"
                  echo "Using {{ .Values.config.backend }} PluginFactory.properties in $dir"
                elif [ -f "${dir}WEB-INF/classes/PluginFactory.properties" ]; then
                  echo "WARNING: $src not found, using the image's default PluginFactory.properties in $dir" >&2
                else
                  echo "ERROR: neither $src nor a default PluginFactory.properties found in $dir" >&2
                  exit 1
                fi
              done

              echo "org.apache.catalina.startup.VersionLoggerListener.level = OFF" >> /var/lib/tomcat/conf/logging.properties
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: "tomcat-base"
              mountPath: "/var/lib/tomcat"
            - name: "tomcat-cache"
              mountPath: "/var/cache/tomcat"

        {{- include "cadc-tap.cloudSqlProxyContainer" . | nindent 8 }}

      containers:
        - name: "tap-server"
          {{- if eq .Values.config.backend "pg" }}
          image: "{{ .Values.config.pg.image.repository }}:{{ .Values.config.pg.image.tag }}"
          imagePullPolicy: {{ .Values.config.pg.image.pullPolicy | quote }}
          {{- else if eq .Values.config.backend "bigquery" }}
          image: "{{ .Values.config.bigquery.image.repository }}:{{ .Values.config.bigquery.image.tag }}"
          imagePullPolicy: {{ .Values.config.bigquery.image.pullPolicy | quote }}
          {{- else }}
          image: "{{ .Values.config.qserv.image.repository }}:{{ .Values.config.qserv.image.tag }}"
          imagePullPolicy: {{ .Values.config.qserv.image.pullPolicy | quote }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          env:
            - name: CATALINA_OPTS
              {{- /*
                Service and database configuration lives in the
                catalina.properties key of the cadc-tap-config ConfigMap, which
                the entrypoint appends to Tomcat's catalina.properties so every
                entry becomes a system property. Only the JVM heap size and the
                database passwords stay here.
              */}}
              value: >-
                -Xmx{{ .Values.config.jvmMaxHeapSize }}
                -Dtapschemauser.password=$TAP_SCHEMA_PASSWORD
                {{- if or (eq .Values.uws.type "cloudsql") (eq .Values.uws.type "external") }}
                -Duws.password=$UWS_DB_PASSWORD
                {{- end }}
                {{- if eq .Values.config.backend "pg" }}
                -Dtap.password=$TAP_DB_PASSWORD
                {{- else }}
                -Dtap.password=$TAP_SCHEMA_PASSWORD
                {{- end }}
                {{- if and (eq .Values.config.backend "qserv") (not .Values.config.kafka.enabled) }}
                -Dqservuser.password=$QSERV_DB_PASSWORD
                {{- end }}
            - name: "BACKEND"
              value: {{ .Values.config.backend | quote }}
            - name: "CATALINA_BASE"
              value: "/var/lib/tomcat"
            - name: "CATALINA_HOME"
              value: "/usr/share/tomcat"
            - name: "HOME"
              value: "/home/tomcat"
            {{- if (and (eq .Values.config.backend "qserv") (not .Values.config.kafka.enabled) .Values.config.qserv.passwordEnabled) }}
            - name: "QSERV_DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "cadc-tap"
                  key: "qserv-password"
            {{- end }}
            {{- if eq .Values.config.backend "pg" }}
            - name: "TAP_DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "cadc-tap"
                  key: "pgpassword"
            {{- end }}
            {{- if .Values.tapSchema.useVaultPassword }}
            - name: "TAP_SCHEMA_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "cadc-tap"
                  key: "tap-schema-password"
            {{- else }}
            - name: "TAP_SCHEMA_PASSWORD"
              value: "{{ .Values.tapSchema.password }}"
            {{- end }}
            {{- if .Values.uws.useVaultPassword }}
            - name: "UWS_DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "cadc-tap"
                  key: "uws-db-password"
            {{- end }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/etc/creds/google_creds.json"
            {{- if eq .Values.config.gcsBucketType "S3" }}
            - name: "AWS_SECRET_ACCESS_KEY"
              valueFrom:
                secretKeyRef:
                  name: "cadc-tap"
                  key: "AWS_SECRET_ACCESS_KEY"
            - name: "AWS_ACCESS_KEY_ID"
              valueFrom:
                secretKeyRef:
                  name: "cadc-tap"
                  key: "AWS_ACCESS_KEY_ID"
            {{- end }}
            {{- if .Values.config.sentryEnabled }}
            - name: "SENTRY_TRACES_SAMPLE_RATE"
              value: "{{ .Values.config.sentryTracesSampleRate }}"
            - name: "SENTRY_ENVIRONMENT"
              value: {{ .Values.global.host }}
            - name: "SENTRY_RELEASE"
              {{- if eq .Values.config.backend "pg" }}
              value: "{{ .Values.config.pg.image.tag }}"
              {{- else if eq .Values.config.backend "qserv" }}
              value: "{{ .Values.config.qserv.image.tag }}"
              {{- else if eq .Values.config.backend "bigquery" }}
              value: "{{ .Values.config.bigquery.image.tag }}"
              {{- else }}
              value: "{{ .Values.config.qserv.image.tag }}"
              {{- end }}
            - name: "SENTRY_DSN"
              valueFrom:
                secretKeyRef:
                  name: "cadc-tap"
                  key: "sentry-dsn"
            {{- end }}
            - name: DATALINK_PAYLOAD_URL
              value: "{{ .Values.config.datalinkPayloadUrl }}"
            {{- if .Values.config.kafka.enabled }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  key: bootstrapServers
                  name: cadc-tap-kafka-access
            - name: KAFKA_GROUP_ID
              value: {{ .Values.config.kafka.consumerGroupId | quote }}
            - name: KAFKA_QUERY_TOPIC
              value: {{ .Values.config.kafka.topics.jobRun | quote }}
            - name: KAFKA_STATUS_TOPIC
              value: {{ .Values.config.kafka.topics.jobStatus | quote }}
            - name: KAFKA_DELETE_TOPIC
              value: {{ .Values.config.kafka.topics.jobDelete | quote }}
            {{- end }}
          ports:
            - containerPort: 8080
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: "google-creds"
              mountPath: "/etc/creds"
              readOnly: true
            - name: "tmp"
              mountPath: "/tmp"
            - name: "config-volume"
              mountPath: "/config"
              readOnly: true
            - name: "tomcat-base"
              mountPath: "/var/lib/tomcat"
            - name: "tomcat-logs"
              mountPath: "/var/log/tomcat"
            - name: "tomcat-home"
              mountPath: "/home/tomcat"
            - name: "tomcat-cache"
              mountPath: "/var/cache/tomcat"
            - name: "ca-trust"
              mountPath: "/etc/pki/ca-trust/source/anchors"
            {{- if .Values.config.kafka.enabled }}
            - name: "kafka-certs"
              mountPath: "/etc/cadc-tap/kafka/ca.crt"
              readOnly: true
              subPath: "ssl.truststore.crt"
            - name: "kafka-certs"
              mountPath: "/etc/cadc-tap/kafka/user.crt"
              readOnly: true
              subPath: "ssl.keystore.crt"
            - name: "kafka-certs"
              mountPath: "/etc/cadc-tap/kafka/user.key"
              readOnly: true
              subPath: "ssl.keystore.key"
            {{- end }}
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /tap/availability
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
      volumes:
        - name: "google-creds"
          secret:
            secretName: "cadc-tap"
        - name: "tmp"
          emptyDir:
            sizeLimit: 1Gi
        - name: "config-volume"
          configMap:
            name: "cadc-tap-config"
        - name: "tomcat-base"
          emptyDir:
            sizeLimit: 500Mi
        - name: "tomcat-logs"
          emptyDir:
            sizeLimit: 100Mi
        - name: "tomcat-home"
          emptyDir:
            sizeLimit: 100Mi
        - name: "tomcat-cache"
          emptyDir:
            sizeLimit: 2Gi
        - name: "ca-trust"
          emptyDir:
            sizeLimit: 50Mi
        {{- if .Values.config.kafka.enabled }}
        - name: "kafka-certs"
          secret:
            secretName: "cadc-tap-kafka-access"
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
