name: "idfdemo"
fqdn: "demo.lsst.cloud"
title: "SQuaRE demo in GCP"
description: >-
  An ephemeral environment for demonstrating Phalanx on Google Cloud Platform
  including, but not necessarily limited to, the Rubin Science Platform. This
  environment is used as a playground or scratchpad environment for bootcamps,
  conferences, experiments, and other temporary deployments.

appOfAppsName: "science-platform"
butlerServerRepositories:
  dp02: "https://demo.lsst.cloud/api/butler/repo/dp02/butler.yaml"
gcp:
  projectId: "science-platform-demo-9e05"
  region: "us-central1"
  clusterName: "science-platform-demo"
onepassword:
  connectUrl: "https://roundtable-dev.lsst.cloud/1password"
  vaultTitle: "Phalanx data-demo.lsst.cloud"
vaultPathPrefix: "secret/phalanx/idfdemo"

applications:
  butler: true
  datalinker: true
  fastapi-bootcamp: true
  ghostwriter: true
  mobu: true
  nublado: true
  portal: true
  squareone: true
  ssotap: true
  tap: true
  times-square: true
  vault-secrets-operator: true
