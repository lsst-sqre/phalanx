name: "usdfprod-prompt-processing"
fqdn: "usdfprod-prompt-processing.slac.stanford.edu"
title: "USDF Prompt Processing"
description: >-
  The production environment for Prompt Processing at the United States Data
  Facility (USDF) hosted at SLAC.

appOfAppsName: "prompt-processing"
vaultUrl: "https://vault.slac.stanford.edu"
vaultPathPrefix: "secret/rubin/usdf-prompt-processing"

applications:
  # This environment uses an ingress managed in a separate Kubernetes cluster,
  # despite that configuration not being officially supported by Phalanx.
  cert-manager: false
  ingress-nginx: false
  vault-secrets-operator: false

  apdb-backups-gcp: true
  butler-writer-service: true
  gafaelfawr: true
  keda: true
  next-visit-fan-out: true
  prompt-kafka: true
  prompt-keda-latiss: false
  prompt-keda-lsstcam: true
  prompt-pub: true
  prompt-redis: true
  s3-file-notifications: true
  sasquatch: true
  strimzi-registry-operator: true
  strimzi: true
